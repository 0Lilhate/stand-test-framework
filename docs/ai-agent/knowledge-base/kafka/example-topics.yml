# Example KB entries — Kafka topics. Schema: ../schema/kafka-topic.schema.json
# 'direction: produced' = the system under test publishes here, so tests consume via kafka.expect.
# Correlation is HEADER-only (the SDK rejects KEY/PAYLOAD_FIELD carriers at run time).
# The REAL topic name is NOT here — it is per-environment (environments/*.yml, kafka.topics[].actualName)
# and lands only in the registry's literal 'name:' field, never in a scenario.
# Kafka assertions are equals-only in the SDK; timeout is mandatory and bounded.
kafkaTopics:
  - id: request-created-topic
    alias: request-created
    direction: produced
    description: Request created event, published after a request is accepted
    correlation:
      source: HEADER
      headerName: X-Correlation-Id
    key:
      strategy: variable
      variable: requestId
    payload:
      schemaRef: schemas/kafka/request-created.schema.json
      requiredFields:
        - requestId
        - status
    assertions:
      - path: $.status
        equals: ACCEPTED
    timeout: 30s
    allowedEnvironments:
      - dev
      - ift
  # A topic whose producer sets NO correlation header. The block is absent, exactly as it is absent in
  # the registry (TopicDefinition.correlation is nullable), and the description carries the price:
  # without a carrier, kafka.expect can select only by a per-run-derived key — and with neither, the
  # topic cannot be awaited at all on this SDK. Recorded so that nobody spends an afternoon
  # rediscovering it, and so that the entry is not mistaken for one somebody forgot to finish.
  - id: audit-trail-topic
    alias: audit-trail
    direction: produced
    description: "Audit trail, published by a legacy producer that sets no X-Correlation-Id. kafka.expect selects by the run-derived key below; were the key absent too, the topic would be unusable for awaiting and the case would need another observation point."
    key:
      strategy: variable
      variable: requestId
    timeout: 30s
    allowedEnvironments:
      - dev
      - ift
