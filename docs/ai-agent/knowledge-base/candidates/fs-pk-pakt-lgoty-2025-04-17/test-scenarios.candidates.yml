    title: "ИТР: ручной режим, авто-объекты не создаются"
    goal: "Проверить, что ИТР не обрабатывается автоматически (Status=EDIT), объекты создаются вручную."
    preconditions: ["Передан ИТР"]
    testData: ["JSON BenefitsScheme с ИТР"]
    action: "МУП вызывает REST-сервис ПК с текстом ИТР"
    expected:
      rest: ["HTTP 200"]
      kafka: []
      db: ["PACTPREFLog: строки INDEX Status=EDIT; авто-ИТ не создаются"]
      grpc: []
    assertions: ["response status == 200", "PACTPREFLog.Status == 'EDIT' для индексных строк ИТР"]
    cleanup: ["unresolved"]
    risks: ["Проверка отсутствия авто-объектов требует уточнения ожидаемого состояния", "Kafka по ИТР: уведомление МУП следует из правил (индексы ИТР не входят в конец-REST пакет; единичная привязка — на UI-операции L609-615), но документ не даёт этого явным ожиданием для ИТР-флоу -> инференс, не hard-assert"]
