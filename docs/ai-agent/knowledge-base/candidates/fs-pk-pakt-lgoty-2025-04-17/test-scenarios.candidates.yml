  - id: ltr-happy-path-auto
    title: "Happy path: автоматическая обработка ЛТР"
    goal: "Проверить, что валидный ЛТР обрабатывается автоматически: создаются/утверждаются ИТ/ТУ/Тариф, журнал Status=AUTO, МУП уведомлён."
    preconditions: ["Передан ЛТР с кодом ТП/ПУ и совпадающими версиями индексов"]
    testData: ["JSON BenefitsScheme с ЛТР по простому индексу", "codeTariffsPack реального ТП/ПУ"]
    action: "МУП вызывает внутренний REST-сервис ПК с текстом ЛТР"
    expected:
      rest: ["HTTP 200 без тела"]
      kafka: ["Пакетное уведомление в МУП с привязками ИТ->индекс в конце обработки"]
      db: ["PACTPREFLog: головная строка Type=DECISION; строки INDEX Status=AUTO"]
      grpc: []
    assertions: ["response status == 200", "PACTPREFLog.Status == 'AUTO' для индексных строк ЛТР", "получено Kafka-уведомление привязки ИТ"]
    cleanup: ["Стратегия очистки не задана в ФС -> unresolved"]
    risks: ["Нет testRunId-колонки для изоляции", "Точное имя топика/схема Kafka неизвестны", "method/path REST неизвестны"]
    source:
      documentId: fs-pk-pakt-lgoty-2025-04-17
      documentName: "ФС ПК ПАКТ.Льготы 2025.04.17"
      documentVersion: "1.0.4"
      page: 15
      section: "3.2.4 / 2.6.8.1"
      heading: "Обработка ЛТР/ИТР"
      quote: "Создание объектов тарификации по ЛТР полностью в автоматическом режиме, все объекты утверждаются автоматически."
    confidence: medium
    kbDependencies:
      endpoints: [pk-process-tr-request]
      kafkaTopics: [it-index-binding-notification]
      datasources: [pk-taksa-db]
      dbProbes: [journal-index-status-probe, journal-head-by-decision-probe]
      grpcTargets: []
