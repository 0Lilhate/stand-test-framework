# Feeds stand-test-scenario-design as domain vocabulary. Verbatim from section "1. Термины и сокращения".
documentId: fs-pk-pakt-lgoty-2025-04-17
source:
  documentName: "ФС ПК ПАКТ.Льготы 2025.04.17"
  documentVersion: "1.0.4"
  section: "1"
  heading: "Термины и сокращения"
  page: 7
abbreviations:
  - term: ЛТР
    definition: "Льготное тарифное решение (ПАКТ.Льготы)"
  - term: ИТР
    definition: "Индивидуальное тарифное решение (ПАКТ.Льготы)"
  - term: ПАКТ.Льготы
    definition: "Единая система управления льготными и индивидуальными тарифами Банка и подключения их клиентам"
  - term: EQ
    definition: "Автоматизированная банковская система Equation"
  - term: ТР
    definition: "Тарифное решение. ТР ПАКТ.ЕСУТ или ЛТР/ИТР ПАКТ.Льготы"
  - term: ТП
    definition: "Стандартный Тарифный план (Тарифный сборник)"
  - term: ПУ
    definition: "Стандартный Пакет услуг"
  - term: ИПУ
    definition: "Индивидуальный пакет услуг (ПАКТ.Льготы)"
  - term: ПК
    definition: "Продуктовый каталог (Такса) — реализует REST-сервис, операцию обработки, журнал, Kafka-уведомление"
  - term: МУП
    definition: "Модуль управления подписками (Такса) — вызывает REST-сервис ПК, потребитель Kafka-уведомления"
  - term: ТК
    definition: "Тарифный калькулятор (Такса) — расчёт комиссии"
  - term: ИТ
    definition: "Индивидуальный тариф (Такса) — объект тарификации: условия применения, параметры, цена"
  - term: ТУ
    definition: "Тарифицированная услуга (Такса)"
terms:
  - term: "ИТ (в Таксе)"
    definition: "Объект тарификации в Таксе, привязываемый к индексам, клиентам и счетам по ЛТР/ИТР"
  - term: "Условия оказания услуги для ИТ"
    definition: "Блок параметризации ИТ — здесь ограничение по филиалу/отделению совершения операции"
  - term: "Лимитный индекс"
    definition: "Индекс-лист без параметров цены; услуга с типом тарификации 2 (с Лимитом) или 0; всегда ручная настройка"
  - term: "Сложный индекс"
    definition: "Индекс, включающий несколько под-индексов; для льготируемых индексов создаются усечённые Тарифы"
aliases:
  - code: Individual_No_Standart
    meaning: "Код tariffPacks/codeTariffsPack для ИТР — ручной режим"
  - code: UNIVERSAL
    meaning: "Код tariffPacks/codeTariffsPack — льгота на все ТП/ПУ; интерпретируется и обрабатывается как ИТР (ручной режим)"
