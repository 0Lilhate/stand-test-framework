      section: "3.2.7"
      heading: "Требования к автоматическому уведомлению МУП о привязке ИТ к льготируемым индексам в ПК"
      quote: "Уведомление МУП о привязке ИТ к льготируемым индексам выполняется через внутреннюю Kafka Таксы в формате JSON. При первичной обработке ТР через REST-сервис отправляется одно пакетное сообщение с привязками ИТ по всем индексам, для которых удалось подобрать или создать ИТ; формирование и отправка - в самом конце работы REST-сервиса. При повторной обработке ранее направленные привязки пере-отправляются. В операции привязки ИТ к индексу отправляется единственная привязка."
      extractionNotes: "Producer=ПК, consumer=МУП, direction=produced (система под тестом эмитит). Триггеры: конец REST-обработки / конец повторной обработки / операция привязки в UI. Формат JSON-сообщения описан в §4.2.1.1 (вложение image11.emf, §3.2.7 L617 ссылается туда за форматом Kafka); имя топика в тексте ФС не приведено вовсе. NB: image12.emf — это входящая структура запроса ЛТР/ИТР (другое сообщение). -> см. unresolved kafka-topic-name / kafka-payload-schema. Алиас логический."
