# review-decisions.yml — human review decisions for DIGEST candidate families.
#
# WHY THIS FILE: business-flows / business-rules / test-scenarios are SEMANTIC digest content.
# Their candidate schemas (business-rule.schema.json etc.) intentionally have NO status/review field
# and are additionalProperties:false, so an approval cannot be stamped inside the *.candidates.yml.
# Approvals for digest families are recorded HERE (a review artifact, not a schema-validated candidate).
#
# DISPOSITION: these are NOT promoted into the strict 8-collection curated KB — there is no
# `businessRules` collection by design (a category enters the curated KB only if it is a runtime
# contract the SDK resolves). "Approved digest" means: trusted to feed stand-test-scenario-design /
# stand-test-case-analysis, and to project into testCaseMapping.assumptions/missing when a concrete
# test is authored. Nothing is written to services/endpoints/kafka/db/... by this decision.
