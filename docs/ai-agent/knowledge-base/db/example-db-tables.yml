# Example KB entry — DB table. Schema: ../schema/db-table.schema.json
# A structural contract for a test-relevant table: schema-qualified name, its columns, the primary key
# and the reserved testRunId tag column that db.seed/db.cleanup scope on. No data, no secrets, no
# connection details (those live on the datasource + environment). References a datasource by id
# (example-datasources.yml, one direction of reference).
dbTables:
  - id: client-orders-table
    datasourceId: client-test-data-db
    description: >-
      Orders table seeded and cleaned up by a test (example entry). It points at the WRITE-ALLOWED
      datasource, not at the readonly one: a table declaring a testRunIdColumn is declaring that
      db.seed/db.cleanup may target it, and a seed against a readonly datasource is refused. The
      readonly `client-db` is for probes (example-db-probes.yml); its schema is not in this one's
      allowedSchemas and must not be.
    schema: test_data
    table: orders
    columns:
      - id
      - status
      - amount
      - test_run_id
    primaryKey:
      - id
    testRunIdColumn: test_run_id
    tags:
      - client
      - orders
