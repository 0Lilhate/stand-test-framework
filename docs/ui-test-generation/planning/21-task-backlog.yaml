      (SHA-256 b6fad94a...) и открылся Playwright Trace Viewer'ом — видны действия шага, их call log,
      Errors 1 и Console 2. Правок в проводке не потребовалось: канал, починенный F003, работает и для
      второго бинарного типа. Второй acceptance_criteria перепроверен в конфигурации, в которой его ещё
      не проверяли — при РАБОТАЮЩЕЙ записи трейса: зелёный прогон f004-trace-green-run не создаёт даже
      каталог артефактов. Прогон нашёл дефект ДОКУМЕНТАЦИИ, и не косметический: комментарий
      PlaywrightDriverFactory, javadoc UiDriver.captureTrace и раздел «Трейс» в stand-test-ui/README.md
      утверждали, что в ZIP лежит «DOM/network-история». Сетевой истории там НЕТ — вкладка Network Trace
      Viewer'а пуста, trace.network 0 байт; замерено двумя трейсами одной страницы (snapshots=false ->
      trace.network 0 B, без resources/; snapshots=true -> 3705 B и HTML-клон кадра). Это цена решения
      SEC-05, а не ошибка: сетевую историю несёт ui-network (S015), и потому артефакты не дублируют друг
      друга. Читатель, поверивший документам, снял бы ui-network как избыточный. Три места приведены к
      фактам, поведение НЕ менялось; закреплено браузерным тестом
      exportedTraceCarriesNoDomCloneAndNoNetworkStory (нет записей resources/ + пустой trace.network +
      непустой networkRequests() как защита от вакуумного прохода). ПРОВЕРЕНО МУТАЦИЕЙ: setSnapshots(true)
      роняет два теста из 41 — новый и PlaywrightUiDriverTraceSecretBrowserTest (в DOM-клоне оказывается
      введённый пароль). Остаток первого acceptance_criteria — только ВИДЕО, оно в out_of_scope S016.
      DONE не ставлю: ревью человеком не проводилось.
