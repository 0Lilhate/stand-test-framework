  - id: UITG-S027
    type: STORY
    title: "Стартер поднимает UiStepExecutor"
    description: "По решению ADR004 — добор исполнителей ServiceLoader'ом в дополнение к бинам либо иной выбранный вариант, с дедупликацией."
    business_outcome: "Spring-потребитель подключает UI без ручного объявления бина"
    wave: 1
    parent_id: UITG-E09
    requirement_ids: [NFR-05]
    artifact_sources: ["CONF-04", "GAP-10", "StandTestAutoConfiguration:112,135-146"]
    affected_modules: [stand-test-spring-boot-starter, stand-test-example]
    status: DONE
    status_reason: >-
      РЕВЬЮ ЗАКРЫТО ЧЕЛОВЕКОМ 2026-08-09: владелец линии рассмотрел карточку и утвердил её.
      Это ПЕРВОЕ человеческое ревью в линии — сплошная сверка 2026-08-07 была агентской, и
      каждая карточка несла об этом отдельную фразу. Теперь оговорка снята по существу, а не
      переписана. DoD «адоптация Spring-потребителями не требует ручного шага» закрыт StepExecutorDiscovery и проверен настоящим Spring-контекстом.
      || Прежняя запись:
      ВЫПОЛНЕНА 2026-08-08, в день разблокировки. Заведён StepExecutorDiscovery в стартере: список
      исполнителей = бины ПЛЮС всё, что зарегистрировано через META-INF/services. Компиляционного ребра
      starter -> ui не появилось, nothingDependsOnUi НЕ трогался — ровно ради этого вариант Б и выбран.
      ПРИОРИТЕТ БИНА ОБЕСПЕЧЕН ДВУМЯ РАЗНЫМИ МЕХАНИЗМАМИ, потому что они закрывают разные случаи:
      ПОРЯДКОМ (бины ставятся первыми, а раннер берёт первого совпавшего — так побеждает даже чужой
      класс потребителя, claiming тот же тип) и ДЕДУПЛИКАЦИЕЙ ПО КЛАССУ (SPI-копия класса, уже
      объявленного бином, отбрасывается — обычный случай rest/kafka/db/grpc, которые приходят обоими
      путями всегда). Разведка использует класслоадер КОНТЕКСТА, поэтому адаптер, намеренно убранный с
      classpath, не воскресает.
      НАЙДЕН И ЗАКРЫТ ДЕФЕКТ, КОТОРОГО НЕ БЫЛО В ПЛАНЕ, и он про production, а не про тест: запись в
      META-INF/services, чей класс не загружается, заставляет ServiceLoader бросить
      ServiceConfigurationError НА ИТЕРАЦИИ. Без обработки ошибка выходит из @Bean-метода и КОНТЕКСТ НЕ
      СТАРТУЕТ — одна устаревшая запись в постороннем jar кладёт приложение потребителя, который все свои
      адаптеры объявил бинами и разведки не просил. Сделано: WARN и пропуск, обход итератора ограничен
      сверху (ошибка приходит из hasNext(), неограниченный цикл повесил бы контекст вместо старта).
      Это не сокрытие: тип шага остаётся без исполнителя, и раннер скажет ровно это — тот же громкий
      отказ, что был до разведки. ADR дополнен пунктом 5.
      ВТОРАЯ ПОПРАВКА К ADR, сделанная по факту, а не подогнанная: пункт 4 обещал строку INFO,
      перечисляющую «какие ТИПЫ ШАГОВ пришли из SPI». Это невыполнимо — StepExecutor объявляет только
      предикат supports(String), перечислить типы через контракт нельзя. Строка называет КЛАССЫ.
      ДЕСЯТЬ ТЕСТОВ НА ДВУХ УРОВНЯХ, и разделение продиктовано самим решением: стартеру нельзя зависеть
      от stand-test-ui, поэтому в нём проверяются только ПРАВИЛА слияния на фейках
      (StepExecutorDiscoveryTest, 6: SPI-только исполнитель доходит; бин побеждает SPI на одном типе;
      один класс из двух источников даёт одну запись; объявление ровно одно; нечего добавить -> молчит,
      но DEBUG о пропуске есть; без бинов список даёт SPI). НАСТОЯЩАЯ КОМПОЗИЦИЯ — в stand-test-example,
      единственном модуле, где весь граф на одном тестовом classpath, а арх-правило сканирует только main
      (DO_NOT_INCLUDE_TESTS) и потому не затрагивается: StarterDiscoversUiExecutorTest (4) поднимает
      РЕАЛЬНЫЙ Spring-контекст с РЕАЛЬНЫМ stand-test-ui и проверяет, что UiStepExecutor доходит до раннера
      без единого бина. Это прямое применение урока F003 (каждое звено покрыто, композиция не исполнялась).
      Документация тем же изменением: раздел «Adapters discovered on the classpath» в README стартера —
      то самое место, где обход НЕ был описан и что обесценило вариант В при выборе ADR; ADR дополнен
      пунктами 5 и поправкой к 4; javadoc StepExecutorDiscovery несёт причины, а не пересказ.
      В стартер добавлен implementation(libs.slf4j.api) — ФАСАД, как в core и всех адаптерах; биндинг
      по-прежнему поставляет потребитель. В stand-test-example logback переведён testRuntimeOnly ->
      testImplementation: тест читает объявление разведки из лога.
      Подтверждено: ./gradlew build --rerun-tasks зелёный, 1610 тестов / 0 падений / 1 намеренный пропуск
      (было 1600 — прирост ровно на десять новых), checkstyle 0, JaCoCo >=80%. browserTest не требовался:
      под stand-test-ui не тронуто ни файла.
