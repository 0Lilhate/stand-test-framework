      ВЫПОЛНЕНА 2026-08-08, в тот же день, что и разблокирована. Канал устаревания заведён в
      EnvironmentConfigFormat.warnIfBehind — в единственной точке, куда уже сходятся обе поверхности, так
      что «обе ведут себя одинаково» получается по построению, а не по совпадению. Предупреждение
      привязано к разбору документа (один раз на загрузку, на поверхность), а не к резолву алиаса.
