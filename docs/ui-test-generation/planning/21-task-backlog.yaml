      не мог пойти первым.
      Тупик был НЕВИДИМ, пока V001 держат ещё и X001/X004/X005, и обнажился бы ровно тогда, когда ИБ
      подпишет и учётки выдадут, — то есть в момент, когда всё остальное будет готово. Найден тем же
      приёмом, что вскрыл DoR ADR002: зависимость проверялась не «жива ли», а «тому ли вопросу
      поставлена».
      Новая редакция: «материалы существуют, опубликованы, и все их ссылки резолвятся». Это ровно то,
      от чего зависит V001 — существование материалов, а не факт их предъявления; предъявление же
