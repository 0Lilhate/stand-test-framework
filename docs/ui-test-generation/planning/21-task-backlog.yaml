      какой стадии есть готовый пример, а у какой только форма; usage-guide.md получил вход для ручного
      тестировщика в §4а и блок «материалы для обучения». Бланк кейса не дублировался: он существует
      (.claude/skills/stand-test-ui-case-intake/ui-case-template.md, 13 разделов, адресат назван в нём самом),
      а копия обучающего материала расходится с оригиналом на первой правке — вместо копии дана карта разделов
