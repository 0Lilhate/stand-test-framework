      отставшая версия, а не ошибка — прямое прочтение решения «WARN при version < SUPPORTED».
      ГЛАВНОЕ ЗДЕСЬ — ФОРМУЛИРОВКА, и она запинена жёстче кода: тест запрещает словарь удаления
