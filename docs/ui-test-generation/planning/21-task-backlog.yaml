      Волна 2 с 2026-08-09, и причина не в ресурсе, а в ПРЕДМЕТЕ. ADR002 принят в этот день (вариант А),
      то есть первое предусловие закрыто и механизм решён. Второе — «X007 дал способ удаления хотя бы
      для одного приложения» — получило ОТРИЦАТЕЛЬНЫЙ ответ: у taksa-portal пути удаления нет ни UI, ни
      API, ни БД. UiCompensator компенсирует средствами самого UI, а средств нет: реализовывать нечего,
      и написанный механизм остался бы без единого вызывающего.
      Карточка перенесена в волну 2 (поле wave 1 -> 2) вместо того, чтобы держать BLOCKED: блокировка
      подразумевает работу, которая начнётся, когда снимут препятствие, а здесь препятствие снимается
      только ПОЯВЛЕНИЕМ приложения, у которого есть что отзывать. Это состав волны, а не блокировка.
      Возврат в волну 1 — если такое приложение появится в её составе (пересмотр G-6).
