    type: TASK
    title: "Привести матрицу зависимостей к фактам и втянуть её в перепись"
    description: >-
      docs/ui-test-generation/planning/22-task-dependency-matrix.md названа ВТОРЫМ из трёх входов
      команды /next-ui-task («зависимости и критический путь»), то есть это документ, который
      открывают, чтобы выбрать следующую задачу. Снят 2026-08-03 и с тех пор правился только шапкой.
      К 2026-08-10 колонка «Статус» расходится с 21-task-backlog.yaml в 52 строках из 79, и
      расхождение однобокое: восемь ЗАКРЫТЫХ внешних гейтов (X001, X004, X006, X007, X008, X009,
      X010, X013) числятся BLOCKED, четыре ПРИНЯТЫХ решения (ADR003, ADR004, ADR005, ADR008) —
      READY, девять посаженных порций (S001..S009) — IN_PROGRESS. Пяти карточек, заведённых после
      снимка (T005..T009), нет в таблице вовсе. Читатель, выбирающий работу по этой таблице, видит
      восемь гейтов ожидающими ответа, который уже дан.
      Механизм устаревания тот же, что у T007 и T008: статус ПЕРЕСКАЗЫВАЕТСЯ в сводке вместо сверки с
      источником, и ни одна перепись этот документ не видит. Отдельно существенно, что средство уже
      было названо и не сработало: поправка шапки 2026-08-08 сама объявила «правится перегенерацией
      таблицы из 21-task-backlog.yaml» и отдала эту правку карточке F002 — а F002 закрылась DONE
      2026-08-09, не сделав её. Названный владелец исчез вместе с закрытием, и работа осталась без
      исполнителя.
    business_outcome: "Следующая задача выбирается по актуальному графу, а не по снимку недельной давности"
    wave: 1
