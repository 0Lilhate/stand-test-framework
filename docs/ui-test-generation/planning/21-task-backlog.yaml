      которого пункт и держали открытым: бинарный канал вложений был МЁРТВ на всём пути от потребителя,
      потому что трёхаргументный конструктор публикатора не имел ни одного вызывающего в production.
      || Прежняя запись:
      DoD ЗАКРЫТ 2026-08-07 (сессия UITG-F003): ручной прогон сделан, картинка в отчёте Allure ВИДНА —
      отчёт 34-allure-manual-run-report.md, снимок отчёта assets/34-allure-manual-run.png. ОПРОВЕРГНУТ довод,
      которым пункт отводили («действие человека, а не сессии»): stand-test-allure регистрирует
      ReportingEventPublisher, stand-test-ui — StepExecutor, оба через META-INF/services, поэтому
      потребительский проект ВНЕ сборки репозитория (инвариант nothingDependsOnUi не затрагивается)
      композирует их без compile-ребра, а allure CLI есть в системе. ПРОГОН НАШЁЛ ДЕФЕКТ, ради которого пункт
      и держали открытым: первый прогон дал в отчёте три вложения из четырёх — diagnostics, ui-console,
      ui-network, — а СКРИНШОТ НЕ ДОШЁЛ, хотя PNG лежал на диске. Причина не в UI-модуле и не в guard'е:
      AllureReportingEventPublisher, который и создаёт ServiceLoader, строил AllureAttachmentPublisher
      ДВУХАРГУМЕНТНЫМ конструктором, то есть без каталога артефактов, а публикатор без каталога fail-closed
      отвергает ЛЮБОЕ файловое вложение. Трёхаргументный конструктор не имел ни одного вызывающего в
      production — его звали только тесты. То есть бинарный канал был мёртв на всём пути от потребителя: все
      звенья покрыты по отдельности, композиция не исполнялась ни разу. ПРАВКА: определение каталога вынесено
      в ядро (core/event/RunArtifacts — имя свойства, умолчание и ЧИСТАЯ функция разрешения; ядро ничего не
      читает и не открывает), UiRunSettings делегирует ему обе константы и разрешение,
      AllureReportingEventPublisher разрешает тем же вызовом — один источник на двух читателей, не видящих
      друг друга, приём EnvironmentConfigFormat.SUPPORTED_VERSION. Имя stand.test.ui.artifacts.dir сохранено:
      оно опубликовано, переименование сломало бы конфигурации ради опрятности. Три теста, каждый падал бы до
      правки (доставка через ТОТ конструктор, что зовёт SPI; файл снаружи каталога по-прежнему отвергается;
      производитель и сток читают одно определение) плюс RunArtifactsTest (5). ПРОВЕРЕНО МУТАЦИЕЙ: возврат
      конструктора к (lifecycle, null) роняет РОВНО один тест из 66. Второй прогон: на упавшем шаге четыре
      вложения, включая ui-screenshot image/png 1280x800 (размер совпал с профилем desktop реестра — вьюпорт
      действительно пришёл конфигурацией), отчёт открыт, вложение разворачивается КАРТИНКОЙ. Побочно
      закрыт давний пробел документации: ни одна README не называла обязательный allure-junit5 (SDK тянет
