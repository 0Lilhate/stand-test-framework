    status_reason: >-
      Выполнена (трейс-часть; видео вынесено в out_of_scope решением по итогам ревью — см. ниже). Поле trace,
      которое было распарсено и не потреблялось, теперь читается сквозной цепочкой:
      EnvironmentUiApplicationResolver переносит application.trace() в ResolvedUiApplication (новый компонент
      UiTraceMode trace с дефолтом OFF), PlaywrightDriverFactory по ON_FAILURE вызывает
      tracing().start(snapshots:false, screenshots:false), а ветка отказа UiStepExecutor ПОСЛЕ maskSensitive
      снимает трейс (ZIP) и прикладывает его файловым Attachment (application/zip) к упавшему шагу. По
      умолчанию OFF: tracing().start не запускается, captureTrace возвращает null (тест OFF это доказывает на
      реальном Chromium). Критерии приёмки: №1 (по умолчанию ничего) — unit
      failingStepWithTraceOffCapturesScreenshotOnly + browser offApplicationRecordsNoTrace; №2 (ZIP
      открывается Trace Viewer'ом) — browser onFailureApplicationSealsATrace проверяет non-empty ZIP с магией
      PK\x03\x04; №3 (поле потребляется) — EnvironmentUiApplicationResolverTest
      traceModeComesFromTheRegistry/absentDefaultOff. Порядок «маскирование → скриншот → трейс» закреплён
      тестом через call-индексы FakeUiDriver (failingStepWithTraceEnabledCapturesTraceAfterMask); срыв трейса
      логируется и не подменяет отказ шага (throwingTraceIsLoggedAndKeepsScreenshotAndStepFailure). Обнаружен
      и устранён собственной сборкой дефект: captureTrace звал tracing().stop без start() на OFF-приложении
      (снято guard traceEnabled). Закрытие замечания ревью (MEDIUM-6): на зелёном прогоне активный трейс-буфер
      освобождается в close() (releaseActiveTrace → tracing().stop() без файла) и артефакта не создаёт —
      подтверждено browser-тестом greenRunReleasesTraceWithoutWritingAFile. browserTest 0 падений (включая
      новый PlaywrightUiDriverTraceBrowserTest), полный build 0 падений, checkstyle 0, JaCoCo >=80%. README
      получил раздел «Трейс» (документация тем же изменением). DoD «по умолчанию поведение не изменилось»
      подтверждён OFF-тестом. Осталось ревью человеком — DONE не ставлю. || РЕВЬЮ 2026-08-07 — АГЕНТСКОЕ, не
      человеческое, выполнено по прямому указанию владельца: карточка разобрана, DoD подтверждён фактами
      (прогоны, а не чтение). build 1566 тестов / 0 падений / 1 намеренный пропуск, browserTest 40/40.
