    title: "OQ-11: порог допустимой недоступности стендов"
    description: "Определить порог, выше которого NFR-01 не применяется, а недоступность эскалируется владельцам стендов."
    business_outcome: "Flaky rate перестаёт маскировать нестабильность стендов"
