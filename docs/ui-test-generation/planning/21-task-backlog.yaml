      ЗАКРЫТ 2026-08-09 ОТРИЦАТЕЛЬНЫМ ответом, и это валидное закрытие: acceptance_criteria гейта
      звучит «по каждому приложению назван способ удаления ЛИБО зафиксировано, что его нет». Ответ
      владельца приложения по taksa-portal: способа удаления тестовых данных, созданных через UI, НЕТ —
      ни интерфейсом, ни API, ни БД.
      Следствие ровно то, что предписывает negative_scenarios карточки: остаточные данные объявляются в
      отчёте генерации, а BR-24 для этого приложения НЕ закрывается. Матрица прослеживаемости не
      двигается — BR-24 остаётся NOT_IMPLEMENTED, и теперь у него названа причина, внешняя по отношению
      к SDK.
      ГЛАВНОЕ ПОСЛЕДСТВИЕ НЕ ОЧЕВИДНО И НАЗВАНО ЗДЕСЬ ЯВНО: definition_of_ready карточки ADR002 гласит
      «X007 дал способ удаления хотя бы для одного приложения волны». Этот вход закрыт ответом «нет»,
      то есть DoR ADR002 стал НЕВЫПОЛНИМ при нынешнем составе волны — не «ещё не выполнен», а не
      достижим без изменения входных условий. Снимается двумя способами, оба принадлежат людям: второе
