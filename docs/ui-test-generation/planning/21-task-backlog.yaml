  - id: UITG-ADR008
    type: ADR
    title: "ADR-UI-012: параллельность классов или классов и методов"
    description: >-
      BR-25 требует параллельности методов внутри класса; реализована параллельность классов при
      mode.default = same_thread. Три варианта: понизить BR-25 / признать отдельным требованием /
      оставить конфликт.
    business_outcome: "Матрица прослеживаемости перестаёт нести ARCHITECTURAL_CONFLICT"
    wave: 0
    parent_id: UITG-E02
    requirement_ids: [BR-25, BR-34]
    artifact_sources: ["CONF-02", "stand-test-ui/src/test/resources/junit-platform.properties"]
    affected_modules: [stand-test-ui]
    status: DONE
    status_reason: >-
      ПРИНЯТ 2026-08-09 владельцем: вариант Б. Написан и принят ADR-UI-012 — документа не существовало,
      поэтому принятие означало выбрать вариант И написать ADR, как было с ADR004. BR-25 НЕ понижается;
      параллельность методов внутри класса признана отдельным требованием к изоляции состояния тестового
      класса и уходит в волну 2 (S034).
      РЕШИЛ ЗАМЕР, А НЕ ПРЕДПОЧТЕНИЕ. mode.default временно переключён на concurrent, набор модуля дал
      213 из 214, и единственное падение — UiParallelExecutionConfigTest, который пинит саму
      конфигурацию, то есть страж сработал как задумано; ни одного падения от разделяемого состояния.
      Файл возвращён побайтно (git status чист), набор перепрогнан зелёным.
      ЗАМЕР ОПРОВЕРГ ДОВОД ВАРИАНТА А. Комментарий junit-platform.properties обосновывает same_thread
      инвариантом «один прогон сценария = один поток», но инвариант объясняет, почему не параллелятся
      ШАГИ одного сценария; два @Test-метода — два разных прогона, и о них он молчит. Обоснование не
      поддерживало выбор, который им обосновывали, а понижать требование ради препятствия, которого нет,
      значит отдавать дёшево доставшееся.
      ГРАНИЦА ЗАМЕРА НАЗВАНА, а не умолчана: прогнан набор САМОГО SDK, а BR-25 говорит о сгенерированном
