  - id: UITG-S022
    type: STORY
    title: "Привязка хуков безопасности к событиям под opencode"
    description: "Под opencode хуки не привязаны к событиям: гейт держится только на .claude. Реализовать плагин stand-guard для второго хоста."
    business_outcome: "SEC-06 работает на обоих поддерживаемых хостах, а не на одном"
    wave: 1
    parent_id: UITG-E06
    requirement_ids: [SEC-06, BR-23]
    artifact_sources: ["GAP-14", "docs/plans/ai-agent-kit-implementation.md", "docs/ai-agent/.opencode/"]
    affected_modules: [docs/ai-agent, stand-test-ai-schema]
    status: IN_REVIEW
    status_reason: >-
      ОСТАЁТСЯ IN_REVIEW после ревью 2026-08-07: DoD «SEC-06 не зависит от выбора хоста» не выполнен, и это
      названо честно — под opencode нет гейта завершения сессии (событие возвращает void и отказать не может)
      и нет субагентов, поэтому стадии 2/4/8/11 идут в основном контексте. Плагин и разбор команд паритетны,
      гейт — нет. || Прежняя запись: Реализовано: .opencode/plugin/stand-guard.js вешает тот же
      hooks/stand-guard.mjs на события инструментов opencode — tool.execute.before (write/edit -> pre-write,
      bash -> pre-bash) и tool.execute.after (-> post-write, post-run). definition_of_ready закрыт ФАКТОМ, а
      не памятью: контракт вычитан из установленного бинаря opencode 1.18.12 — автообнаружение из
      .opencode/plugin/*.{js,ts}, экспорт ФУНКЦИИ (input) => Promise<Hooks>, сигнатуры
      tool.execute.before(input, output) и after с args, имена инструментов write/edit/bash и их аргументы
      filePath/content/oldString/newString/replaceAll/command. Подтверждено прогонами: (1) настоящий opencode
      грузит плагин — маркер в логе после создания сессии через HTTP API, без обращения к модели; (2) драйвер,
      вызывающий хук так же, как хост: write с Thread.sleep — REFUSED, edit с Thread.sleep — REFUSED, чистая
      запись — ALLOWED, `rm -rf /` — REFUSED, `./gradlew build` — ALLOWED. Пять тестов
      OpencodeGuardPluginTest, плюс plugin/ заведён каталогом ассетов в PromptBundleInventoryTest и
      исключением в BundleParityTest. Документация обновлена тем же изменением: AGENTS.md (.opencode),
      usage-guide.md и — главное — rules/stand-test-pipeline.md в ОБЕИХ копиях, где утверждение «под opencode
      нет автоматической половины» стало ложным. Честная граница названа везде: под opencode НЕ заведён гейт
      завершения сессии (event возвращает void, отказать не может) и нет субагентов (out_of_scope карточки),
      поэтому паритетом целиком это не является. Регресс 1481 тест, 0 падений.
    priority: P1
