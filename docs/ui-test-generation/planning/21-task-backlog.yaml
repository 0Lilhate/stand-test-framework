      ВОПРОСА: может ли SDK ВЫРАЗИТЬ компенсацию — архитектура, предмет этого ADR — и есть ли у
      конкретного приложения ЧЕМ компенсировать — свойство приложения. Отрицательный ответ X007
      («способа нет ни UI, ни API, ни БД») касался второго и сделал DoR невыполнимым при составе волны
      1, хотя решение принять было можно и нужно.
