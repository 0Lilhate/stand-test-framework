      removed») И ТРЕБУЕТ слова «readable» — сообщение обязано сказать вслух, что файл остаётся
      читаемым, иначе читатель додумает угрозу сам. Это прямое следствие принятой политики «окна нет»:
      предупреждение, обещающее отказ, которого не будет, обесценивает и себя, и соседние WARN.
      ДЕВЯТЬ ТЕСТОВ на трёх уровнях: EnvironmentConfigFormatLoggingTest (5 — один WARN с обеими версиями;
      отсутствие ключа предупреждается так же и на том же уровне; актуальная версия молчит совсем; запрет
      словаря отказа плюс требование «readable»; сообщение — чистая функция версии и location),
      EnvironmentConfigVersionWarningTest (2, файловая поверхность на НАСТОЯЩЕМ документе: один WARN на
      загрузку, и он не называет ни одного алиаса, ни одного *-ref, ни имени среды — security_requirement
      карточки проверен там, где загрузчик реально держит их все в руках), StarterVersionWarningTest (2,
      Spring-поверхность: location — префикс свойств, а не файл; молчание на актуальной версии).
      Уровень поверхностей заведён не для полноты: репозиторий уже платил за «каждое звено покрыто,
      композиция не исполнялась ни разу» (F003, мёртвый бинарный канал вложений).
      ПРОВЕРЕНО ПАДЕНИЕМ: до правки красные 4 теста из 5 в ядре (пятый — «молчит на актуальной версии» —
      проходил и до неё, что честно записано). ПРОВЕРЕНО МУТАЦИЕЙ ТРИЖДЫ: снятие канала целиком роняет 6
      тестов на трёх модулях; подмена фразы на «This version will stop being supported» роняет РОВНО тест
      формулировки; предупреждение всегда (включая актуальную версию) роняет РОВНО три теста «молчит»,
      по одному на поверхность. После каждой файл восстановлен идентично.
      Документация в том же изменении: корневой README (таблица разбита на < / = / >, добавлен абзац
      «окна нет» с явным «WARN не является уведомлением о будущем отказе»), stand-test-config/README.md
      (то же плюс почему предупреждение висит на разборе документа), javadoc класса (строки таблицы) и
      warnIfBehind (почему формулировка ограничена политикой). В stand-test-config и
      stand-test-spring-boot-starter добавлен testImplementation(libs.logback.classic) — канал наблюдаем
      только как лог-строка; зависимость ТОЛЬКО тестовая, SDK по-прежнему поставляет фасад, а не биндинг.
      Подтверждено: ./gradlew build --rerun-tasks зелёный, 1600 тестов / 0 падений / 1 намеренный пропуск
      (было 1591 — прирост ровно на девять новых), checkstyle 0, JaCoCo >=80%. browserTest не требовался:
      под stand-test-ui не тронуто ни файла. DONE не ставлю: ревью человеком сессией не заменяется.
      || Прежняя запись: РАЗБЛОКИРОВАНА 2026-08-08: ADR003 принят, политика выбрана — ОКНА НЕТ (вариант А), каждая версия
      от 1 до SUPPORTED_VERSION читается бессрочно. Оба входа закрыты (ADR003 DONE, S006 DONE).
      ВАЖНО ДЛЯ ИСПОЛНИТЕЛЯ: implementation_notes ниже предполагали, что при варианте А «кода может не
      потребоваться вовсе». Это больше не так — владелец сверх рекомендации решил завести КАНАЛ
      УСТАРЕВАНИЯ: WARN при declared < SUPPORTED_VERSION. Сегодня в EnvironmentConfigFormat нет ни
      одного warn, так что код требуется, и он ложится в единственную точку, куда уже сходятся обе
      поверхности (requireSupported).
      ГЛАВНОЕ В ЭТОЙ РАБОТЕ — ФОРМУЛИРОВКА, А НЕ КОД, и она вытекает из пары решений: раз окна нет,
      сообщение НЕ ИМЕЕТ ПРАВА утверждать или подразумевать, что файл перестанет читаться. Это была бы
      прямая неправда, а WARN, угрожающий отказом, которого не будет, обесценивает и себя, и соседние
      предупреждения. Сообщает факт (реестр объявляет формат N, SDK читает до M) и то, что доступны
