    status_reason: >-
      ВЫПОЛНЕНА 2026-08-10. Заведена этой же сессией как находка сверки: сессии-исполнимой задачи в
      бэклоге не было (все пять READY — EXTERNAL, вопросы к людям вне команды SDK), и работа взята НЕ
      из бэклога — это записано здесь, а не подразумевается. Прецедент тот же, которым заведены T007,
      T008 и T009.
      СДЕЛАНО: (1) таблица §4 ПЕРЕГЕНЕРИРОВАНА из 21-task-backlog.yaml — 86 строк вместо 79 (пять
      недостающих T005..T009 плюс V006 и T004 на своих местах); колонка «Статус» приведена к YAML в
      52 строках; колонка «Blocks» пересчитана по единому правилу (объединение поля blocks и ОБРАТНЫХ
      ссылок depends_on / external_dependencies / adr_dependencies) и потому больше не расходится в 23
      строках. (2) Зачёркивание закрытой зависимости стало ПРАВИЛОМ, а не пометкой от руки: зачёркнуто
      ровно то, чья карточка в DONE или REJECTED — и это правило пинится тестом в обе стороны.
      (3) Разделы §5, §6, §7 приведены к фактам: §5 обещал «двенадцать READY» и называл сессии-
      исполнимыми задачи, закрытые неделю назад; §7 предлагал отложить S011/S027/S028/S029 — все
      четыре DONE.
      КОЛОНКИ Critical path И Lane НЕ ПИНЯТСЯ НАМЕРЕННО и сохранены как были: в YAML таких полей нет,
      это суждение о плане, а не производная от него. Тест, заморозивший бы суждение, был бы второй
      копией, а не проверкой — тот же довод записан в AdrWorklistCensusTest про прозу.
      ЗАКРЫТО ТЕСТОМ, а не однократной правкой: BacklogMatrixCensusTest (7 тестов, stand-test-ai-schema)
      держит §4 против YAML по составу строк, статусу, depends_on, blocks и обеим колонкам гейтов.
      ПРОВЕРЕНО ПАДЕНИЕМ на таблице ДО правки: красные ЧЕТЫРЕ теста из семи — состав строк, статус,
      blocks и зачёркивание, — при зелёном контроле невакуумности. Зелёными остались ровно два
      содержательных: depends_on и тип, и это СОВПАЛО с поправкой шапки 2026-08-08, которая называла
      колонку Depends on единственной верной во всех 81 строке. Число «четыре» замерено, а не оценено:
      до прогона в карточке стояло «шесть из семи», и оно исправлено по факту.
      ПРОВЕРЕНО МУТАЦИЕЙ ТРИЖДЫ, каждая ловится СВОИМ тестом и только им: возврат строки X001 к статусу
      BLOCKED роняет theStatusColumnRepeatsTheBacklog; снятие зачёркивания с ~~X010~~ в строке X005
      роняет struckThroughMeansClosedAndNothingElse; удаление строки T009 роняет
      everyWorkingCardHasExactlyOneRow. После каждой файл восстановлен.
      Подтверждено: ./gradlew build --console=plain зелёный, :stand-test-ai-schema:test зелёный.
      browserTest не требовался: под stand-test-ui не тронуто ни файла.
      DONE не ставлю: ревью человеком сессией не заменяется.
