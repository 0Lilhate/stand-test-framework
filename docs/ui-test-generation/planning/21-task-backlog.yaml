      Четыре уточнения приняты вместе с вариантом; практическое действует уже сейчас — X010 обязан
      назвать параллельность, СЧИТАЯ методы, иначе размер пула будет посчитан по классам и окажется мал
      в день включения. AdrWorklistCensusTest 5/5 после правки worklist.
