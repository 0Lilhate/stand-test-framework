  - id: UITG-T009
    type: TASK
    title: "Кит везёт правила разрешений, которые хост объявляет недействующими"
    description: >-
      В docs/ai-agent/.claude/settings.json 18 правил записаны в написаниях, которые Claude Code не
      применяет: 9 Write(...) (8 в deny, 1 в ask) и 9 MultiEdit(...) (8 в deny, 1 в ask). Хост говорит
      про них прямо и по-разному: MultiEdit(...) — «matches no known tool» (такого инструмента больше
      нет), Write(path) — «is not matched by file permission checks — only Edit(path) rules are».
      На старте КАЖДОЙ сессии это 27 строк предупреждений (9 + 18) перед первым полезным выводом.
      ЗАЩИТА ПРИ ЭТОМ ЦЕЛА, и это проверено программно, а не предположено: у каждого из 18 мёртвых
      правил есть парное работающее Edit(...) на тот же путь, а Edit по сообщению самого хоста
      покрывает все инструменты записи. То есть это гигиена и шум, а НЕ дыра в защите .claude/** и
      knowledge-base/schema/** — карточку нельзя раздувать до инцидента.
      Почему не поймали раньше: ClaudeSettingsSafetyTest.denyList_coversTheOpencodePolicy фильтрует
      rules("deny") по startsWith("Edit(") — он по построению смотрит только на работающие написания и
      о существовании остальных не знает. Найдено прогоном кита вживую (headless-сессия батча), а не
      чтением файла: предупреждения печатает хост, в репозитории их не видно ниоткуда.
    business_outcome: "Потребитель видит вывод сессии, а не 27 строк о правилах, которые ничего не делают"
    wave: 1
    parent_id: UITG-E06
    requirement_ids: [SEC-06]
    artifact_sources: ["docs/ai-agent/.claude/settings.json", "stand-test-ai-schema/src/test/java/ru/alfa/stand/test/ai/ClaudeSettingsSafetyTest.java"]
    affected_modules: [docs/ai-agent, stand-test-ai-schema]
    status: DONE
    status_reason: >-
      РЕВЬЮ ЗАКРЫТО ЧЕЛОВЕКОМ 2026-08-09: владелец линии рассмотрел карточку и утвердил её.
      Это ПЕРВОЕ человеческое ревью в линии — сплошная сверка 2026-08-07 была агентской, и
      каждая карточка несла об этом отдельную фразу. Теперь оговорка снята по существу, а не
      переписана. DoD закрыт обеими половинами: чистый старт замерен (27 предупреждений -> 0) и защита подтверждена побайтным сравнением множеств до/после.
      || Прежняя запись:
      ВЫПОЛНЕНА 2026-08-08. Снято 18 правил (9 Write(...), 9 MultiEdit(...)) из permissions.deny/ask
      docs/ai-agent/.claude/settings.json; политика НЕ менялась — менялось только написание.
      ГЛАВНОЕ ДОКАЗАТЕЛЬСТВО, что защита не сузилась, снято сравнением множеств ДО и ПОСЛЕ, а не
      рассуждением: множество путей под Edit( в deny (21) и в ask (3) побайтно идентично до и после
      правки. Это же зафиксировано тестом на будущее, а не только в отчёте.
      ДВА НОВЫХ ТЕСТА в ClaudeSettingsSafetyTest (5 -> 7): (1)
      permissionRules_useOnlySpellingsTheHostApplies запрещает Write(/MultiEdit( во всех трёх секциях
      с объяснением, почему мёртвое правило ХУЖЕ отсутствующего — оно читается как защита, поэтому
      следующий путь, добавленный только в таком написании, окажется незащищённым и незаметно;
      (2) guardedPaths_areExactlyThePinnedSet пинит МНОЖЕСТВО охраняемых путей (21 deny + 3 ask), то
      есть снятие защиты больше не может пройти под видом чистки написаний. Сообщения хоста
      намеренно НЕ пинятся — они принадлежат хосту и меняются с его версией (negative-сценарий
      карточки); пинится написание в нашем файле.
      ПРОВЕРЕНО ПАДЕНИЕМ: до правки красный ровно новый тест (1) при зелёном (2) — то есть периметр
      был записан верно ещё до снятия правил. ПРОВЕРЕНО МУТАЦИЕЙ ДВАЖДЫ, каждая ловится своим тестом:
      возврат одного Write(./.claude/hooks/**) роняет (1); удаление Edit(./.claude/hooks/**) роняет (2)
      и заодно denyList_coversTheOpencodePolicy. После обеих файл восстановлен идентично.
      DoD «чистый старт сессии» ЗАКРЫТ ЗАМЕРОМ, а не выводом: кит переустановлен в черновой проект
      (install.mjs --force, 133 файла) и прогнана минимальная сессия claude -p — предупреждений о
      правилах 0 (было 27: 9 «matches no known tool» + 18 «is not matched by file permission checks»).
      Единственная оставшаяся строка stderr — о недоверенном рабочем каталоге, это свойство черновой
      установки и вынесено картой в out_of_scope. MANIFEST.json перегенерирован (install.mjs
      --manifest, 266 файлов) — без этого KitManifestTest уронил бы сборку на изменившемся хеше.
      opencode-копия не тронута: в opencode.json таких правил нет вовсе (проверено), паритет не
      затрагивается — BundleParityTest зелёный.
      Подтверждено: ./gradlew build --rerun-tasks зелёный, 1591 тест / 0 падений / 1 намеренный
      пропуск (было 1589 — прирост ровно на два новых), checkstyle 0, JaCoCo >=80%,
      :stand-test-ai-schema:test зелёный. browserTest не требовался: под stand-test-ui не тронуто ни
      файла. DONE не ставлю: ревью человеком сессией не заменяется.
    priority: P2
    size: XS
    uncertainty: LOW
