  - id: UITG-V006
    type: VALIDATION
    title: "Инструментальная поддержка базовых замеров G-2"
    description: >-
      Определить, нужен ли инструмент для сбора базы (часы на тест, доля покрытого регресса, flaky
      rate, объём ручного регресса) или достаточно существующего kpi-collection-template.md. Сбор
      выполняют QA-лиды — команда SDK только поддерживает.
    business_outcome: "База G-2 собирается в формате, сопоставимом с последующими замерами KPI"
    wave: 1
    parent_id: UITG-E10
    requirement_ids: [KPI-1, KPI-2, KPI-3, KPI-5]
    artifact_sources: ["BRD §14 G-2", "docs/agent-evaluation/kpi-collection-template.md"]
    affected_modules: [docs/agent-evaluation]
    status: DONE
    status_reason: >-
      РЕВЬЮ ЗАКРЫТО ЧЕЛОВЕКОМ 2026-08-09. definition_of_done «формат базы согласован либо признано,
      что шаблона достаточно» выполнен первой половиной: формат согласован владельцем — отдельная форма.
      ПЕРЕД ПЕРЕВОДОМ НАЙДЕН И ЗАКРЫТ НЕВЫПОЛНЕННЫЙ ПУНКТ, которого не было видно в DoD:
      documentation_changes карточки называет kpi-collection-template.md, а сессия его не трогала —
      построила новый файл и остановилась. Пункт закрыт тремя правками парного шаблона, и каждая
      отвечает на вопрос, который иначе остался бы у читателя: (1) в шапке объявлено, что шаблон меряет
      сторону ПОСЛЕ, а база собирается формой; (2) клетка «База G-2 (ручной путь), ч-ч» — та самая
      единственная клетка, из-за которой шаблона и не хватило, — теперь показывает, ОТКУДА берётся
      число, и говорит «не считать здесь»; (3) в разделе «Что этот шаблон не измеряет» уточнено, что
      базы KPI-2 и KPI-5 всё же собираются — в форме, — и отсутствуют тут потому, что у них нет
      стороны «после», а не потому, что не нужны.
      Без этих правок расхождение вернулось бы первым же читателем шаблона: он видел бы клетку базы и
      не знал, откуда её взять, — ровно то состояние, ради устранения которого форма и строилась.
      negative_scenarios («база в формате, несопоставимом с KPI волны 1») закрыт зеркалированием
      формата и теперь ещё и перекрёстной ссылкой в обе стороны.
      || Прежняя запись:
      ВЫПОЛНЕНА 2026-08-09. DISCOVERY снят ответом QA-лида, которого требовал собственный
      definition_of_ready («QA-лиды назвали способ и формат сбора базы»): нужна ОТДЕЛЬНАЯ форма базы, а
      не расширение существующего шаблона. Сделана — docs/agent-evaluation/g2-baseline-collection-form.md.
      РЕШЕНИЕ ОПЁРЛОСЬ НА ФАКТ, А НЕ НА ПРЕДПОЧТЕНИЕ. Существующего kpi-collection-template.md не
      хватает, и это следует из него самого: он объявляет себя формой замеров «по прогонам эталонного
      набора и по смерженным тестам волны 1», то есть меряет сторону ПОСЛЕ; для базы он держит ОДНУ
      клетку («База G-2 (ручной путь), ч-ч»), не говоря, откуда её взять; а KPI-2 и KPI-5 не покрывает
      по собственному признанию — раздел «Что этот шаблон не измеряет». Две из четырёх баз, которых
      требует X002, не описаны нигде.
      ОБА acceptance_criteria закрыты конструкцией формы. (1) «Формат базы совпадает с форматом
      последующих замеров» — форма повторяет шапку замера, форму таблиц, правило заполнения («пустая
      клетка = не мерили, прочерк = мерили, значения нет») и раздел «чем это число НЕ является»
      парного шаблона; в конце таблица «куда попадает каждое число». (2) «Оговорка §13.3 о двойном
      счёте отражена в форме» — раздел разделения объёма стоит ПЕРВЫМ и делит перечень на A (ручной),
      B (покрыт существующими наборами, остаётся) и C (покрыт, но будет переписан), с прямым указанием,
      что в формулу входят A и C, а B не входит.
      Названо то, что легко потерять: ошибка в этом разделении не видна в самом числе — она проявится
      только тем, что окупаемость окажется лучше, чем есть.
      KPI-5 записан нулём ПО ПОСТРОЕНИЮ, а не по наблюдению, и строка оставлена в форме именно затем,
      чтобы ноль был записан: по правилу заполнения пустая клетка означала бы «не мерили».
      Сессия чисел не собирала — сбор выполняют QA-лиды, форма даёт «что и в каких знаменателях».
    priority: P1
    size: S
    uncertainty: HIGH
    owner_role: QA lead
