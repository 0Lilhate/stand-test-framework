    status_reason: >-
      ЗАКРЫТ 2026-08-09. Ответ QA-лида: порог допустимой недоступности стендов — НЕ БОЛЕЕ 5% прогонов.
      Выше порога результат ночного прогона не засчитывается, а вопрос идёт владельцам стенда.
      Число совпадает с целью flaky rate волны 1 (NFR-01, <=5%), и это не совпадение, а довод:
      недоступность стенда не должна шуметь громче самих тестов, иначе её невозможно отделить от
      настоящей нестабильности на глаз.
      Вторая половина acceptance_criteria — «способ отделения недоступности от flaky определён» —
      закрыта не этим ответом, а УЖЕ ДЕЙСТВУЮЩИМ определением NFR-01: падения по причине недоступности
      стенда исключаются из flaky rate и учитываются ОТДЕЛЬНЫМ счётчиком как доступность стенда, вне
      контроля проекта. То есть механизм разделения существовал до гейта, не хватало только числа.
      Практическое следствие названо: при 10% каждый десятый ночной прогон бесполезен, и пять зелёных
      подряд (DoD S025) собирались бы заметно дольше. При 5% этот эффект остаётся в пределах разумного.
