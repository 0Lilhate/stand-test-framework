    status_reason: >-
      ЗАКРЫТ 2026-08-09. Ответ дал владелец в сессии по подготовленному материалу (41 §X010):
      ДВА одновременных прогона, ДВЕ учётки на каждую роль — итого шесть (client×2, operator×2,
      admin×2). acceptance_criteria «названо число параллельных прогонов и требуемый размер пула по
      каждой роли» выполнен обоими числами; definition_of_done «X005 может быть закрыт числом» тоже —
      владельцу приложения теперь называется конкретное число на роль, а не диапазон.
      Число выбрано не наугад. Оно совпадает с умолчанием браузерного набора
      (stand.test.ui.browser.parallelism=2), потому что поток стоит одного Chromium. Запаса по NFR-03
      хватает с избытком — самый долгий UI-сценарий 10,3 с при бюджете 180 с, семнадцатикратно, — то
