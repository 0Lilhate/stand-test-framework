      продемонстрировать не может; здесь речь о ВОСПРОИЗВОДИМОСТИ РАЗБОРА, и она обеспечена четырьмя
      командами, каждая опубликована дословно вместе с настоящим выводом.
      || Прежняя запись:
      ОСТАЁТСЯ IN_REVIEW после ревью 2026-08-07: DoD «материалы предъявлены команде пилота до V001» не
      выполнен — V001 в BLOCKED, предъявлять некому. Сами материалы на месте и закреплены
      TrainingMaterialLinksTest. || Прежняя запись: Выполнено:
