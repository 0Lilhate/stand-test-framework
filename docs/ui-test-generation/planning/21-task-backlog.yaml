  - id: UITG-S011
    type: STORY
    title: "Переиздание 00-current-state.md и пометка приложений BRD"
    description: >-
      00-current-state.md утверждает, что модуля stand-test-ui не существует. Переиздать либо явно
      пометить снимком на cf81358. Приложения §21/§22 BRD пометить иллюстрациями намерения; норма —
      ADR-UI-003 и код. ADR-UI-004 перевести в Accepted пост-фактум.
    business_outcome: "Самый цитируемый документ линии перестаёт вводить в заблуждение"
    wave: 0
    parent_id: UITG-F002
    requirement_ids: [BR-06, BR-07, BR-37, D-10]
    artifact_sources: ["CONF-01", "CONF-03", "CONF-06", "CONF-07"]
    affected_modules: [docs/ui-test-generation]
    status: DONE
    status_reason: >-
      РЕВЬЮ ЗАКРЫТО ЧЕЛОВЕКОМ 2026-08-09, и вместе с ним закрыт последний невыполненный пункт DoD.
      Карточка НЕ переводилась вместе с восемью другими в тот же день: её definition_of_done требует
      «CONF-01, CONF-03, CONF-06, CONF-07 закрыты», и CONF-06 стоял «явно принятым, а НЕ закрытым» —
      разница, которую её собственный status_reason называл честно. Сессия отказалась двигать карточку
      по слову «утверждаю», прочитала DoD и вынесла пункт владельцу отдельным вопросом.
      Владелец закрыл CONF-06 решением: расхождение «BR-07 говорит шесть разделов, шаблон несёт
      восемь» принято как ОКОНЧАТЕЛЬНЫЙ ответ, а не отложенное уточнение. Формулировка BR-07 при этом
      НЕ правилась — закрыт вопрос «что считать нормой», а не текст BRD; норма — восемь разделов
      шаблона, и расхождение безопасно в одну сторону, потому что шаблон ШИРЕ требования.
      Запись обновлена в 03-conflicts-and-gaps.md. Четыре из четырёх пунктов DoD выполнены.
      || Прежняя запись:
      ВЫПОЛНЕНА 2026-08-08. Выбрана ВТОРАЯ из двух опций, которые предлагает описание карточки
      («переиздать ЛИБО явно пометить»): документ прочитан целиком — все 833 строки — и каждое
      утверждение, ставшее ложным, помечено на месте. Переиздание отвергнуто по причине, записанной в
      самом документе: он ценен как карта швов, снятая ДО UI-модуля, и переписывание стёрло бы то, ради
      чего его цитируют. Тем самым закрыт остаток, который документ сам откладывал на эту карточку
      («остальные 700 строк построчно не перепроверялись»).
      ПОМЕЧЕНО ЕЩЁ ШЕСТНАДЦАТЬ МЕСТ. Крупное: разрешён конфликт бинарных вложений (§8, §11.4 — у
      Attachment появился Path file, ADR-UI-005); закрыт конфликт версионирования реестра (§7.2, §11.8 —
      version в ROOT_KEYS, ADR-UI-004 принят вместе с политикой «окна нет»); появился пул учёток
      (§11.10); решён жизненный цикл браузера (§11.9). Счётное: модулей 15 (было 14), java-файлов UI 45
      (было 36), тест-классов кита 45 (было 35), детекторов 26 (было 18), скиллов 26 (было 17), команд 19
      (было 14), правил ArchUnit десять (было четыре).
      ОДНО МЕСТО УСТАРЕЛО В ОБРАТНУЮ СТОРОНУ, и оно важнее прочих: §6.2 числила ребро starter -> ui среди
      РАЗРЕШЁННЫХ точек, а ADR-UI-008 (принят накануне) его отверг в пользу discovery через ServiceLoader.
      Читатель, поверивший §6.2, завёл бы сегодня запрещённую зависимость — то есть документ вредил бы, а
      не просто отставал.
      ДВЕ ПОМЕТКИ ПЕРВОЙ СВЕРКИ САМИ СОСТАРИЛИСЬ и получили поправки: «в git модуля ещё нет» (посажен, 89
      файлов) и «правил стало восемь» (десять). Отмечено отдельно, потому что это тот же механизм
      устаревания, только на слой глубже — поправка стареет так же, как текст, который она правит.
      ПРОВЕРЕНО И ОСТАВЛЕНО БЕЗ ИЗМЕНЕНИЙ, не по недосмотру: компенсаторы регистрирует по-прежнему ровно
      одно место (DbStepExecutor:191); ForbiddenOperation.HARDCODED_STAND_URL по-прежнему НЕ испускается
      ни одним валидатором — литеральный URL невозможен потому, что его негде написать; схем KB 20;
      кейсов набора 27. Числа §12 не трогались НАМЕРЕННО: они датированы прогоном на cf81358 и стареют,
      не становясь ложью (правило T007).
      DoD карточки — «CONF-01, CONF-03, CONF-06, CONF-07 закрыты» — выполнен на три четверти, и четвёртая
      названа честно: CONF-01 ЗАКРЫТ этой работой (03-conflicts-and-gaps.md, решение ADR003 от 2026-08-08,
      исходная запись сохранена как история); CONF-03 и CONF-07 закрыты ранее, у CONF-07 отложенная часть
      выполнена сейчас; CONF-06 остаётся «явно принятым», а не закрытым — формулировку BR-07 правит
      владелец BRD, и правка BRD стоит в out_of_scope этой карточки. Оба acceptance_criteria выполнены:
      ADR-UI-004 в Accepted, а «ни один документ не утверждает, что модуля нет» держится
      UiLineDocumentHygieneTest (3/3 зелёные) — утверждение остаётся как запись снимка, но обязано нести
      поправку рядом.
      Подтверждено: ./gradlew build --rerun-tasks зелёный, 1610 тестов / 0 падений / 1 намеренный пропуск
      (новых тестов нет — задача документная, и автотестов карточка не требует: её test_requirements
      предписывают grep, он выполнен). browserTest не требовался.
      DONE не ставлю: ревью человеком сессией не заменяется.
      || Прежняя запись: РАЗБЛОКИРОВАНА 2026-08-08: ADR003 принят владельцем, ADR-UI-004 переведён в Accepted — второй
      критерий приёмки этой карточки («ADR-UI-004 в статусе Accepted») ЗАКРЫТ не ею, а решением, и
      закрыт фактически: статус в файле изменён, перепись AdrWorklistCensusTest это подтверждает.
      Остаётся ровно остаток ОБЪЁМА, названный ниже: F002 закрывала CONF-07 опцией «пометить», а эта
      карточка обещает «переиздать» — ~700 строк построчно не перепроверялись. Это единственное, что
      здесь ещё не сделано; блокировок больше нет.
      || Прежняя запись: Осталась ОДНА половина, и она по-прежнему ждёт ADR003. Первый критерий приёмки («ни один
      документ линии не утверждает, что модуля не существует») выполнен родительской F002 2026-08-04
      и закреплён UiLineDocumentHygieneTest: 00-current-state.md помечен снимком на cf81358 с восемью
      поправками на месте, приложения BRD получили пометку команды SDK. Второй критерий —
      «ADR-UI-004 в статусе Accepted» — остаётся невыполнимым без решения ADR003 (READY, XS,
      архитектор). Открыт и остаток объёма: F002 закрывала CONF-07 опцией «пометить», а эта карточка
