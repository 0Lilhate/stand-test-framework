  - id: UITG-S017
    type: STORY
    title: "Маскирование размеченных зон DOM до снятия артефакта"
    description: >-
      Перед снятием любого визуального артефакта закрывать элементы, помеченные UiLocator.sensitive,
      средствами DOM; порядок «маскирование -> снятие» закрепить тестом, падающим при перестановке.
    business_outcome: "Артефакт перестаёт быть каналом утечки: пароль не попадает на скриншот в принципе"
    wave: 1
    parent_id: UITG-F005
    requirement_ids: [BR-35, SEC-05]
    artifact_sources: ["BRD SEC-05", "UiSecrets", "UiLocator.sensitive"]
    affected_modules: [stand-test-ui]
    status: DONE
    status_reason: >-
      Выполнена. UiDriver получил драйвер-агностичный шов maskSensitive(Collection<UiLocator>, Duration);
      PlaywrightUiDriver реализует его через Page.ScreenshotOptions.setMask + setMaskColor («закрасить
      поверх», не размыть — размытие пропустило бы значение в кадре), не трогая живой DOM. Ветка отказа
      UiStepExecutor маскирует чувствительные зоны упавшего шага ДО captureScreenshot: его собственный locator
      и capture-локаторы с sensitive(), и — критично — поля формы ui.login (username/password из реестра), так
      что скриншот формы входа с введённым паролем содержит поле закрашенным (критерий приёмки №1, SEC-05).
      Порядок «заклеить → снять» закреплён тестом (FakeUiDriver пишет call-строки; asserts maskSensitive до
      captureScreenshot; перестановка в executer уронит тест). Сбой маскирования ОТМЕНЯЕТ снятие — отсутствие
      скриншота безопаснее скриншота с секретом (neg №1); элемент, исчезший к моменту маскирования, не
