      переопределяют, двойники core — тоже. По JaCoCo в stand-test-core у класса METHOD missed 1, INSTRUCTION
      missed 2, covered 0. Дыра не в проценте: default-ветка — это ровно тот способ подключения, к которому
      приглашает javadoc маркера («реализация, которая несёт только вложения, не получает ничего, о чём не
      просила»), и он не проверен ничем. Рядом с ним лежит незакреплённое поведение раннера:
      DefaultScenarioRunner:447 делает diagnostics.putAll(withEvidence.failureDiagnostics()) — реализация,
      вернувшая null, подменит НАСТОЯЩИЙ отказ шага падением ветки отчётности.
