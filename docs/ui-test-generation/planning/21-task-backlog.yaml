      Пул по каждой роли, а не суммарно: худший случай — оба одновременных прогона просят одну роль
      (BR-34).
      Ошибка в меньшую сторону безопасна по построению и названа negative_scenarios карточки: выше пула
      прогоны ОЧЕРЕДЯТСЯ, время набора вырастет, падений не будет. Поэтому решение записано как «2
      сейчас, пересмотр после первого ночного прогона», а не как окончательное: поднять число дешевле,
      чем просить у владельца приложения учётки впрок.
      Методы в подсчёте УЧТЕНЫ в том смысле, какой предписал ADR-UI-012 (уточнение 3): при включении
      параллельности методов волной 2 это число пересчитывается, и пересчёт объявлен здесь, а не
      забыт.
