      - "При любом ответе сохранена сохраняемость исходной выдачи генерации (BR-07 §8) — без неё KPI-4 ненаблюдаем"
    negative_scenarios: ["вариант Г -> кит поддерживает две формы установки, стоимость удваивается"]
    test_requirements: []
