    definition_of_ready: ["QA-лиды назвали способ и формат сбора базы"]
    acceptance_criteria:
      - "Формат базы совпадает с форматом последующих замеров KPI — иначе сравнение невозможно"
      - "Оговорка §13.3 о двойном счёте отражена в форме сбора: ручной регресс отделён от покрытого существующими наборами"
    negative_scenarios: ["база собрана в формате, несопоставимом с KPI волны 1 -> §19.1 неприменим даже при закрытом G-2"]
