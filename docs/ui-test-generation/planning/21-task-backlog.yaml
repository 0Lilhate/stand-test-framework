      РАЗБЛОКИРОВАН 2026-08-09 закрытием X010 — его ЕДИНСТВЕННОЕ оставшееся предусловие («целевая
      параллельность определена») выполнено. Первая половина блокировки снята накануне закрытием X006:
      приложение (taksa-portal), владелец и роли (client, operator, admin) названы.
