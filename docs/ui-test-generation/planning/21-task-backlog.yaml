  - id: UITG-X011
    type: EXTERNAL
    title: "OQ-10: размер команды и стоимость человеко-месяца"
    description: "Числа для §13.1 и модели окупаемости §13.3 — четвёртый порог гейта §19.1."
    business_outcome: "ROI становится вычислимым"
    wave: 0
    parent_id: UITG-E03
    requirement_ids: [OQ-10]
    artifact_sources: ["BRD §13.1", "BRD §19.1"]
    affected_modules: []
    status: READY
    status_reason: >-
      Не закрыт. 2026-08-09 исправлены ВЛАДЕЛЕЦ и РАЗМЕР карточки — по решению владельца линии, после
      того как подготовка ответа вскрыла два расхождения.
      ПЕРВОЕ: owner_role стоял «QA lead», тогда как BRD §20 отдаёт OQ-10 «Руководству качества». Это не
      формальность — числа §13.1/§13.3 это бюджет (размер команды и стоимость человеко-месяца), и
      QA-лид их не назначает. Роль Quality management добавлена в словарь owner_roles аддитивно.
      ВТОРОЕ: размер стоял XS, будто это один ответ. Фактически критерий «§13.1 и §13.3 заполнены
      числами вместо ‹…›» требует СЕМИ строк человеко-месяцев по трём волнам плюс модель окупаемости
      §13.3, то есть оценочной работы, а не ответа; и он требует ПРАВКИ BRD — документа, который правит
      его владелец. Размер исправлен XS -> M.
      Сессия чисел не выдумывала намеренно: у неё нет ни данных тайм-трекинга, ни права назначать
      стоимость человеко-месяца, а придуманное число здесь попало бы прямо в модель окупаемости и в
      четвёртый порог гейта §19.1.
      Остаётся READY: вход ничем не заблокирован, работа принадлежит названному владельцу.
      2026-08-10 ПОДГОТОВЛЕН МАТЕРИАЛ: 43-x011-cost-and-roi-material.md — последний из пяти READY, у
      которого материала не было. Статус НЕ меняется: материал есть форма ответа, а не ответ (то же
      правило применено к X010 накануне).
      Что материал даёт сверх пересказа карточки. (1) ПЕРЕСЧИТАНЫ КЛЕТКИ: их ровно двенадцать —
      одиннадцать в §13.1 и одна в §13.3 (порог 18 месяцев сам стоит в угловых скобках, то есть
      формально не утверждён, и то же число обязано совпасть с §19.1). (2) ЧЕТЫРЕ СТРОКИ ИЗ СЕМИ СТАЛИ
      РЕТРОСПЕКТИВОЙ: волна 1 сделана (35 из 42 карточек DONE, ни одной IN_PROGRESS), и объём под
      каждой строкой предъявлен поимённо — все 42 карточки разнесены по строкам БЕЗ ОСТАТКА, поэтому
      таблицу можно проверить. Достаточно оценить ОДНУ величину и разложить её в этой пропорции вместо
      семи независимых оценок. (3) НАЙДЕНЫ ТРИ ДЕФЕКТА САМОЙ СМЕТЫ: строка про компенсации обещает
      «изменение core, волна 1-2», тогда как ADR-UI-007 принят вариантом А (core не трогается,
      реализация в волне 2) — неверны обе половины; core в волне 1 правился, но под контракт вложений
      и версию реестра, что подтверждает собственный implementation_notes карточки; а двух статей в
      смете нет вовсе — CI (S025, S026) и документы линии (S009, S010, S011, T008, T010), семь
      карточек, и их выпадение — ошибка ОДНОСТОРОННЯЯ, в занижение. (4) НАЗВАНА ОБЯЗАТЕЛЬНАЯ КЛЕТКА,
      КОТОРОЙ В BRD НЕТ: часов в человеко-месяце — без неё KPI-1 в часах и стоимость в ч-м не сходятся,
      и два человека возьмут разный делитель. (5) РАЗДЕЛЕНЫ ВХОДЫ §13.3: из семи входов формулы X011
      принадлежат ДВА, поэтому заполнение §13.1 закрывает числитель и НЕ делает четвёртый порог §19.1
      вычислимым — знаменатель держится на X002 и замерах после волны 1. Дату гейта определит X002, а
      не этот ответ.
      ЧИСЕЛ ПО-ПРЕЖНЕМУ НЕ ПРИДУМАНО, и почему — записано в материале явно: git-история даёт календарь
      посадки (2026-08-05..2026-08-10), а не трудоёмкость, посадка велась с агентом, и подстановка
      этого интервала занизила бы смету, то есть ПОЛЬСТИЛА бы окупаемости ровно в том пороге, где её
      проверяют.
    priority: P1
