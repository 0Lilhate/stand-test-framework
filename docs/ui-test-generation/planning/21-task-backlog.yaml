  - id: UITG-ADR006
    type: ADR
    title: "ADR-UI-010: где живут сгенерированные UI-тесты и что служит базой дифа KPI-4"
    description: "Четыре варианта: репозиторий продукта / отдельный на команду / централизованный / решает каждая команда."
    business_outcome: "KPI-4 становится наблюдаемым; определяется форма поставки кита"
    wave: 0
    parent_id: UITG-E02
    requirement_ids: [KPI-4, NFR-07, BR-07]
    artifact_sources: ["BRD OQ-07", "PQ-04"]
    affected_modules: [docs/ai-agent]
    status: DONE
    status_reason: >-
      ПРИНЯТ 2026-08-09 владельцем. Написан и принят ADR-UI-010 — документа не существовало, поэтому
      принятие означало выбрать И написать ADR: четвёртый такой случай подряд после ADR004, ADR008 и
      ADR005. Место жизни — ОТДЕЛЬНЫЙ репозиторий владельца набора (предопределено ответом X013). База
      дифа KPI-4 — СНИМОК И ХЕШИ: ui-generation/<scenario-id>/original/ плюс original.sha256.
      Механизм не строился — он уже существует целиком, и это меняло сам вопрос: выбирали не «что
      построить», а «что объявить базой». §8 шаблона отчёта несёт копии, хеши и момент снятия («до
      компиляционных фиксов и правок ревью»), а детектор UI_GENERATION_REPORT_INCOMPLETE уровня BLOCK
      проверяет восемь разделов ПЛЮС существование original.sha256 на диске.
      Git-коммит первой генерации рассмотрен и базой НЕ объявлен — только перекрёстной проверкой.
      Причина не вкусовая: компиляционный фикс меняет исполняемые строки, то есть по букве KPI-4
      ЯВЛЯЕТСЯ правкой; коммит может оказаться после него, и ничто этого не проверяет, тогда как снимок
      проверяется детектором BLOCK. База, снятая поздно, систематически ЗАВЫШАЛА бы метрику.
      Копии решено хранить, а не ограничиваться хешами: хеши отвечают «принят без правок или нет»,
      копии — «что именно пришлось править», а метрика заведена ради второго (RISK-03: KPI-4 < 40% →
      пересмотр промптов).
      acceptance_criteria выполнены оба: решение записано; сохраняемость исходной выдачи не только
      сохранена, но и подтверждена машинной проверкой. AdrWorklistCensusTest 5/5 — и он же поймал
      промежуточное состояние, когда ADR лёг на диск раньше правки worklist.
    priority: P0
    size: S
    uncertainty: HIGH
    owner_role: QA lead
