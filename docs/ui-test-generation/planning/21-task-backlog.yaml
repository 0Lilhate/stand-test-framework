  - id: UITG-E09
    type: EPIC
    title: "Конфигурация и адоптация"
    description: "Подъём UiStepExecutor на Spring-пути, окно совместимости версии реестра, остаток SEC-01."
    business_outcome: "Spring-потребитель подключает UI без ручного объявления бина; политика версий реестра определена"
    wave: 1
    parent_id: UITG-I01
    requirement_ids: [BR-37, SEC-01, D-10]
    artifact_sources: ["CONF-04", "GAP-10", "docs/ui-test-generation/planning/14-plan-review-report.md#2.3"]
    affected_modules: [stand-test-spring-boot-starter, stand-test-core, stand-test-config]
    status: IN_REVIEW
    status_reason: >-
      ВЫПОЛНЕН в исполнимой части 2026-08-08 (вторая сессия дня). Прежняя запись отказывалась ставить
      IN_REVIEW двумя доводами, и один из них с тех пор УМЕР: «S027 не начата» перестало быть верным с
      посадки 194445c — S027 реализована и стоит IN_REVIEW. Второй довод жив и назван ниже.
      acceptance_criteria «Spring-потребитель получает UI-исполнителя без ручного @Bean» подтверждён
      ФАКТАМИ, а не пересказом status_reason потомка: stand-test-ui везёт
      META-INF/services/ru.alfa.stand.test.core.execution.StepExecutor с единственной строкой
      ru.alfa.stand.test.ui.UiStepExecutor; StandTestAutoConfiguration.scenarioRunner склеивает бины с
      SPI через StepExecutorDiscovery.merge; композиция проверена настоящим Spring-контекстом с
      настоящим UI-адаптером (StarterDiscoversUiExecutorTest, 4 теста в stand-test-example — модуле с
      полным графом на одном тестовом classpath), а правила слияния — на фейках в стартере
      (StepExecutorDiscoveryTest, 6). test_requirements закрыты обоими пунктами: тест на
      ApplicationContextRunner есть, ModuleDependencyArchTest зелёный. documentation_changes закрыты:
      раздел «Adapters discovered on the classpath» в README стартера, таблица версий и раздел про
      отсутствие окна совместимости в README stand-test-config.
      negative_scenario проверен состязательно, а не объявлен снятым. Названная его половина
      («ADR004 ослабляет nothingDependsOnUi») не наступила по построению варианта Б — компиляционного
      ребра нет. Проверена и НЕ названная в карточке половина, которая появилась вместе с SPI-подбором:
      может ли подбор воскресить адаптер, выключенный потребителем. Не может — у исполнителей нет
      выключателя вовсе (бины гейтятся только @ConditionalOnClass/@ConditionalOnMissingBean), а
      stand.test.enabled=false не создаёт даже ScenarioRunner, то есть подбор не запускается. Единственный
      бин с выключателем по свойству — публикатор Allure, а он ReportingEventPublisher, которого подбор не
      касается: stand.test.reporting.enabled=false по-прежнему выключает его.
      Конструктор UiStepExecutor, который подбор теперь исполняет на старте Spring-контекста, проверен на
      отсутствие ранних побочных эффектов: сессия браузера создаётся лениво, на первом реально исполняемом
      UI-шаге, поэтому потребитель, у которого stand-test-ui оказался на classpath, не платит за браузер.
      definition_of_done «ни одной задачи эпика в BLOCKED без названной причины» выполнен: S027 и S028
      стоят IN_REVIEW, S029 — DISCOVERY_REQUIRED с названной причиной. DONE не ставлю: контейнер не может
      опережать детей, а S029 (остаток SEC-01) — решение владельца роли Security за внешним гейтом X004
      (G-4), не работа сессии.
    priority: P2
    size: S
    uncertainty: LOW
    owner_role: SDK developer
    depends_on: [UITG-ADR003, UITG-ADR004]
    blocks: []
    external_dependencies: []
    adr_dependencies: [UITG-ADR003, UITG-ADR004]
    risk_ids: [RISK-09]
    definition_of_ready: ["ADR003 и ADR004 приняты"]
    acceptance_criteria: ["Spring-потребитель получает UI-исполнителя без ручного @Bean"]
    negative_scenarios: ["решение по ADR004 ослабляет nothingDependsOnUi -> протокольный тест тянет браузер в classpath"]
    test_requirements: ["ApplicationContextRunner-тест в стартере", "ModuleDependencyArchTest остаётся зелёным"]
    security_requirements: ["SEC-01: остаток обсуждается в S029"]
    observability_requirements: []
    documentation_changes: ["stand-test-spring-boot-starter/README.md", "stand-test-config/README.md"]
    definition_of_done: ["ни одной задачи эпика в BLOCKED без названной причины"]
    out_of_scope: ["переработка модели реестра"]
    implementation_notes: >-
      Обход для S027 работает: потребитель объявляет @Bean UiStepExecutor сам. Поправка 2026-08-08: он НЕ
      был документирован — ни в README стартера, ни в корневом; это и лишило вариант В его заявленного
      преимущества при выборе ADR004.

