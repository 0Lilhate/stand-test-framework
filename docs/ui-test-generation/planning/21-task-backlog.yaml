    definition_of_ready: ["написания правил и их парность проверены на файле"]
    acceptance_criteria:
      - "ни одно правило не остаётся в написании, которое хост объявляет недействующим"
      - "защита каждого пути сохранена: у пути, потерявшего Write/MultiEdit, остаётся работающее Edit"
      - "повторное появление мёртвого написания роняет сборку"
    negative_scenarios:
      - "правила удалены вместе с защитой пути -> запрещено: у каждого удаляемого обязан остаться парный Edit, сверяется до и после"
