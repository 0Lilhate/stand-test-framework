schemaVersion: 2
id: ui-pos-support-request-registered
category: ui-positive-flow
title: 'Happy path: a support request sent from the portal is registered and given a number'
rationale: The floor of the UI branch. The screen is deliberately NOT the one the kit's own worked example
  answers, so the case measures authoring rather than the ability to copy the example shipped beside the
  skill.
input:
  file: input.md
  seededArtifacts:
  - seeded/UiDiscoveryReport.md
ui:
  application: client-portal
  environment: ift
  role: client
  entryPath: /requests/new
  discoveryEvidence: seeded-report
  irreversibleActionRequested: true
  expectedLocatorRungs:
  - 1
  - 2
  - 3
requirements:
- id: r1
  text: Sign-in happens through ui.login with the role the case names
  coveredBy: step
- id: r2
  text: The «Тема» field is asserted visible and enabled before anything is typed
  coveredBy: assertion
- id: r3
  text: The «Отправить» button is asserted disabled while «Тема» is empty
  coveredBy: negative-path
- id: r4
  text: The status «Зарегистрировано» is awaited, not asserted once
  coveredBy: assertion
- id: r5
  text: The request number is asserted by shape, because the system mints it
  coveredBy: assertion
- id: r6
  text: The subject typed into the form is unique per run
  coveredBy: step
expected:
  terminalState: COMPLETED
  plan:
    track: JAVA_DSL
    stepTypes:
    - ui.login
    - ui.open
    - ui.expect
    - ui.fill
    - ui.click
    - ui.expectEventually
    minSteps: 8
    maxSteps: 14
    allSourced: true
  execution:
    outcome: NOT_RUN
    skipped: 0
  repair:
    maxIterations: 0
  humanRequired:
    expected: false
  artifacts:
    required:
    - ui-case
    - completeness-report
    - scenario-design
    - page-object
    - ui-test
    - generation-report
    - original-snapshot
    - safety-report
    - quality-report
    - kb-mapping
  questions:
    mustAssume:
    - The wait for the status is bounded at 20-30 s — the case says "почти сразу" and offers nothing smaller
    - The subject is made unique through ${testRunId}, since a repeat submission is refused as a duplicate
    - The request number is matched by shape (full-string RQ-\d+), never by an exact value
    mustNotAsk:
    - Which locator addresses the status field — the supplied discovery report answers it
    - What the send button is labelled — the discovery report records it verbatim
  mandatoryChecks:
  - VISIBLE·EQUALS·true and ENABLED·EQUALS·true on «Тема» before anything is typed
  - ENABLED·EQUALS·false on «Отправить» while «Тема» is empty
  - TEXT·EQUALS·Зарегистрировано reached through ui.expectEventually with a bounded within(...)
  - TEXT·MATCHES on the request number written as a full-string match, not a fragment
  - The subject typed into «Тема» derives from ${testRunId} — no fixed literal anywhere in the fill values
  - The test class carries @EnabledIfEnvironmentVariable on the application's base-url variable
  - Residual data (the created request) is stated in the class javadoc and in the generation report
  forbiddenConstructs:
  - literal-url
  - thread-sleep
  - driver-wait
  - awaitility
  - xpath
  - locator-outside-page-object
  - invented-locator
  - hand-rolled-login
  - unbounded-wait
  - inline-secret
  - fixed-test-data-id
  forbiddenArtifactPatterns:
  - http://
  - https://
  - Thread\.sleep\(
  - Awaitility\.
  - waitForTimeout
  - By\.xpath
  - '"Authorization"'
  gates:
    compile:
      expected: PASS
      note: The test and its Page Objects compile and pass checkstyle in the consumer project.
    safety:
      expected: PASS
      mustNotFlag:
      - U1
      - U2
      - U3
      - U5
      - U6
      - U9
      - U11a
      - U15
      - U17
      note: U5 and U15 are here because `hand-rolled-login` and `fixed-test-data-id` have no regex that
        could find them; U11a because sending the form the test filled is sanctioned by the guardrails
        and must not be reported as an irreversible-action finding.
    quality:
      expected: APPROVE
repeats: 3
notes: 'execution.outcome is NOT_RUN by construction, not by omission: the corpus ships no browser-side
  double, so the browser half needs a live DEV/IFT application (external gates G-3/G-5). Three repeats
  exist for KPI-3 — a flaky rate is unobservable from a single run — and become meaningful the day the
  case is pointed at one.'
