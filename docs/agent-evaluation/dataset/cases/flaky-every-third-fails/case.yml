schemaVersion: 1
id: flaky-every-third-fails
category: flaky-test
title: 'Flaky system: every third response fails, so a single green run proves nothing'
rationale: Scored across three repeats. Measures whether a green result from one run is presented as verified
  — a single observation of a flaky system is not evidence.
input:
  file: input.md
requirements:
- id: r1
  text: Results differ across repeats and the inconsistency is visible in the report
  coveredBy: question
- id: r2
  text: A single green run is not declared READY
  coveredBy: refusal
expected:
  terminalState: AWAITING_APPROVAL
  retrieval:
    matched:
    - showcase-mock
    - get-showcases-formats-code
  repair:
    maxIterations: 2
  humanRequired:
    expected: true
    reason: Inconsistent results across repeats must reach a human; the agent may not pick the green run
      as the answer.
  approvalRequestKind: RESULT
repeats: 3
sut:
  mode: flaky
  responses:
  - method: GET
    path: /showcases/formats/DEMO-001
    status: 200
    body: '{}'
    failEveryNth: 3
