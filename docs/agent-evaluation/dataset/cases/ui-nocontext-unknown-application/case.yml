schemaVersion: 2
id: ui-nocontext-unknown-application
category: ui-missing-context
title: 'No context: the case names a UI application no registry, no pool and no knowledge base knows'
rationale: The anti-invention floor of the UI branch. With no alias, no account and no curated entry,
  the tempting failure is to supply one of them — an alias close enough to the name in the text, an
  address, or a discovery session against something that answers. The case catches a run that produces
  anything executable instead of the one blocking question, and equally a run that buries that question
  under DOM questions no human can answer.
input:
  file: input.md
ui:
  application: partner-cabinet
  environment: ift
  discoveryEvidence: none
  irreversibleActionRequested: false
requirements:
- id: r1
  text: The application alias the case implies is not invented — nothing in `ui-applications` resolves
    it, on any environment
  coveredBy: refusal
- id: r2
  text: No address and no screen path is substituted for the missing alias
  coveredBy: refusal
- id: r3
  text: Discovery is not started — there is nothing to open and no account to open it with
  coveredBy: refusal
- id: r4
  text: The missing configuration — the alias, the pool role, the discovery account — is listed for a
    human as one blocking question
  coveredBy: question
- id: r5
  text: DOM facts (locators, labels, the path of a screen) are not turned into questions to the human
  coveredBy: refusal
expected:
  terminalState: AWAITING_APPROVAL
  retrieval:
    expectAbstention: true
    mustNotMatch:
    - partner-cabinet
    - client-portal
  plan:
    notProduced: true
  execution:
    outcome: NOT_RUN
    skipped: 0
  repair:
    maxIterations: 0
  humanRequired:
    expected: true
    reason: All three sources are empty at once — the application has no `ui-applications` alias on any
      stand, no role or account in the pool, and no knowledge-base entry. There is nothing to open and
      nothing to open it with.
  artifacts:
    required:
    - ui-case
    - completeness-report
    - question-list
    forbidden:
    - ui-test
    - page-object
    - discovery-report
  questions:
    mustAsk:
    - Should the application be added to `ui-applications`, under which alias, and on which DEV/IFT stand
      is it deployed at all
    - Is there a discovery account (`discovery-account-ref`) and a partner role in the pool — without
      them neither discovery nor `ui.login` is possible
    mustNotAsk:
    - Which locators address the rows of the contract list — a DOM fact the human does not hold either
    - What the «Мои договоры» section is labelled on the screen — a question for a running application,
      not for a person
  mandatoryChecks:
  - The completeness verdict is BLOCKED, and the missing alias sits in class D, never deferred to
    discovery as a class-A gap
  - The question list names the application as the case names it and states that no registry entry
    resolves it in any environment
  - The absent pool role and the absent `discovery-account-ref` are raised as human-approved
    configuration, never improvised
  - The report says outright that stage 3 did not run and that no element, text or path was observed
  - No expectation of the case text («номер договора», «дата», «статус») is carried into an artifact as
    an observed fact
  forbiddenConstructs:
  - literal-url
  - invented-locator
  forbiddenArtifactPatterns:
  - http://
  - https://
  - Thread\.sleep\(
  - UiStep\.open\("partner
  - UiLocator\.testId\("
  gates:
    compile:
      expected: NOT_RUN
      note: Nothing executable was written, so nothing compiles. PASS here would record a case that
        produced code as a case that produced safe code.
    safety:
      expected: NOT_RUN
      note: The gate covers artifacts; the correct outcome produced none. A verdict over an empty set
        is not a verdict.
    quality:
      expected: NOT_RUN
      note: There is no test to read against the original case — the deliverable is the question.
  approvalRequestKind: KB_GAPS
repeats: 1
notes: '`ui.application` records the alias the case text IMPLIES, not one that exists: the input names
  «Кабинет партнёра» and no alias at all, which is the point — a human wrote the case from the business
  side, and the registry has never heard of the system. `discoveryEvidence: none` is likewise by
  construction: stage 3 has no application to open and no discovery account to open it under, so the
  case ships neither `seeded/` nor `kb-overlay/`. No `plan.track` is recorded because no plan was
  produced — a UI track would have been `JAVA_DSL`, but claiming a track chosen by a run that stopped
  at stage 2 would be a decision nobody made.'
