[versions]
java = "21"
javaRelease = "17"
checkstyle = "10.18.2"
junit = "6.0.3"
assertj = "3.27.7"
jacoco = "0.8.15"
archunit = "1.3.0"
slf4j = "2.0.16"
logback = "1.5.12"
springWebflux = "7.0.8"
jsonPath = "2.10.0"
kafkaClients = "4.2.1"
h2 = "2.3.232"
allure = "2.35.4"
snakeYaml = "2.6"
grpc = "1.68.1"
protobuf = "3.25.5"
playwright = "1.61.0"
springDependencyManagement = "1.1.7"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
spring-webflux = { module = "org.springframework:spring-webflux", version.ref = "springWebflux" }
json-path = { module = "com.jayway.jsonpath:json-path", version.ref = "jsonPath" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafkaClients" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
allure-java-commons = { module = "io.qameta.allure:allure-java-commons", version.ref = "allure" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeYaml" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-inprocess = { module = "io.grpc:grpc-inprocess", version.ref = "grpc" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
spring-boot = { module = "org.springframework.boot:spring-boot", version.ref = "springBoot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "springBoot" }
