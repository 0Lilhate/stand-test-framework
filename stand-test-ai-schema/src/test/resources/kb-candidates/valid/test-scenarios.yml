documentId: payments-onboarding-spec-v3
testScenarios:
  - id: create-payment-accepted
    title: "Create payment is accepted end-to-end"
    goal: "Verify a valid payment is accepted, an event is published, and the row is ACCEPTED."
    preconditions: ["Debtor account exists for the run"]
    testData: ["amount below limit", "valid currency"]
    action: "Submit a valid payment request via the create-payment endpoint."
    expected:
      rest: ["201 Created with paymentId and status ACCEPTED"]
      kafka: ["PaymentCreated event with matching correlation id"]
      db: ["payment row status ACCEPTED"]
      grpc: []
    assertions: ["response status equals 201", "db status equals ACCEPTED"]
    cleanup: ["Delete seeded rows by testRunId"]
    risks: ["Await timeout not stated in the spec - recorded as an assumption"]
    source:
      documentId: payments-onboarding-spec-v3
      documentName: "Payments Onboarding Functional Specification"
      page: 24
      section: "7.1"
      heading: "Acceptance test"
      quote: "A valid payment must be accepted, emit an event and persist an ACCEPTED row."
    confidence: medium
    kbDependencies:
      endpoints: [create-payment]
      kafkaTopics: [payment-created]
      datasources: [client-db]
      dbProbes: [payment-status]
      grpcTargets: []
