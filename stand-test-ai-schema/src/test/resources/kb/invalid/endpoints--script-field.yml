# INVALID by design: arbitrary script/code fields are unrepresentable in KB assertions.
endpoints:
  - id: create-request
    serviceId: client-service
    method: POST
    path: /api/requests
    response:
      status:
        success: 200
      assertions:
        - path: $.status
          script: "return response.status == 'ACCEPTED'"
    allowedEnvironments:
      - ift
