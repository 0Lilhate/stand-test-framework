# INVALID by design: *Ref fields carry env-var NAMES; a credential value cannot be spelled.
environments:
  - id: ift
    services:
      - serviceId: client-service
        baseUrlRef: CLIENT_SERVICE_BASE_URL
    datasources:
      - datasourceId: client-db
        urlRef: CLIENT_DB_URL
        userRef: CLIENT_DB_USER
        passwordRef: "Bearer hunter2.secret.value"
