# Stand environment whitelist for the @StandTest examples — in the familiar application.yml, the way
# a consumer team configures its stand autotests. stand-test-config's FileEnvironmentRegistry
# (ServiceLoader SPI) reads the stand.test.environments section below; the exact same tree binds
# natively in a Spring Boot test project via the stand-test-spring-boot-starter.
#
# Every *-ref names an environment variable in the ${NAME} / ${NAME:default} placeholder spelling
# (a bare NAME is accepted too); the env var wins when set, the inline default applies only when it
# is missing. An inline default is a value in the repository, so use it for non-secret DEV endpoints
# only — never give a default to a password ref. The example build pins the variables to the
# in-process doubles' fixed addresses (see build.gradle.kts: CLIENT_SERVICE_URL,
# MAIN_DB_URL/USER/PASSWORD, GRPC_TARGET, KAFKA_BOOTSTRAP_SERVERS).
stand:
  test:
    # Версия ФОРМАТА реестра (не версия SDK). Объявлена явно, потому что секция ui-applications
    # пришла в версии 2, поля auth.login / auth.challenge — в версии 3, а пара
    # auth.credentials-username / credentials-password — в версии 4.
    version: 4
    environments:
      ift:
        services:
          client-service:
            base-url-ref: ${CLIENT_SERVICE_URL:http://127.0.0.1:18080}
            correlation:
              source: HEADER
              name: X-Correlation-Id
        datasources:
          mainDb:
            url-ref: ${MAIN_DB_URL}
            user-ref: ${MAIN_DB_USER}
            password-ref: ${MAIN_DB_PASSWORD}   # secrets: no inline default, ever
            allowed-schemas:
              - test_data
            write-allowed: true
        topics:
          events:
            name: stand-test-example-events
            correlation:
              source: HEADER
              name: X-Correlation-Id
          # A topic may live on a NAMED cluster from kafka-clusters below; topics without a
          # `cluster` alias (like `events` above) use the default kafka-cluster.
          audit:
            name: stand-test-example-audit
            cluster: audit
            correlation:
              source: HEADER
              name: X-Correlation-Id
        grpc-targets:
          health-grpc:
            target-ref: ${GRPC_TARGET}
            correlation:
              source: METADATA
              name: x-correlation-id
        kafka-cluster:
          bootstrap-servers-ref: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        kafka-clusters:
          audit:
            bootstrap-servers-ref: ${AUDIT_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
        # ЕДИНСТВЕННАЯ секция этого файла, которая указывает на НАСТОЯЩИЙ стенд, а не на
        # внутрипроцессный двойник. Ею пользуется только TaksaMainScreenTest, который пропускается,
        # пока не задан пароль технической учётной записи. Остальным прогонам она не мешает: ссылки
        # резолвятся лениво, в момент исполнения шага, а не при чтении файла.
        ui-applications:
          taksa:
            base-url-ref: ${TAKSA_IFT_URL:http://taksa-dev3/}
            default-viewport: desktop
            viewport-profiles:
              desktop: { width: 1440, height: 900 }
            trace: "on-failure"
            auth:
              scheme: STORAGE_STATE
              # У приложения ОДНА техническая учётная запись, поэтому она названа прямо, а не через
              # реестр из нескольких. Пара покрывает все объявленные roles и исключает
              # credentials-pool-ref: способ должен быть один, иначе непонятно, откуда брать учётку.
              #
              # Значение — ССЫЛКА: голое слово это ИМЯ переменной окружения. Спеллинг
              # ${web_password:значение} даёт ЗНАЧЕНИЕ по умолчанию, а не имя запасной переменной:
              # переменная окружения выигрывает, когда задана, иначе берётся то, что после ':'.
              #
              # ЗДЕСЬ ПАРОЛЬ ЗАПИСАН ЗНАЧЕНИЕМ — осознанное решение владельца линии для учётной
              # записи DEV-стенда. Общее правило SDK обратное («паролю дефолт не дают»), потому что
              # значение в файле остаётся в истории git и после замены; на стенде taksa-dev3 цена
              # этого принята. Переменная окружения по-прежнему перекрывает файл, поэтому на другом
              # стенде ничего править не нужно — достаточно задать web_password.
              credentials-username: ${web_username:tks_Admin}
              credentials-password: ${web_password:tks_Admin}
              roles: [admin]
              # discovery-account-ref не объявлен: учётной записи разведки нет, и административная
              # на эту роль не годится (SEC-10). Поле опционально, конфигурация без него валидна.
              challenge: none
              login:
                # Форма KEYCLOAK (realm USERS), а не форма приложения: path открывает taksa, она
                # редиректит на IdP, и заполняется та страница, на которой оказался браузер.
                # Идентификаторы подтверждены по разметке формы; взяты они, а не подписи полей,
                # потому что подписи темы переводятся, а id стабильны.
                path: /
                username-locator: css=#username
                password-locator: css=#password
                submit-locator: css=#kc-login
                # Кнопка выхода в левой колонке — она есть только у вошедшего пользователя.
                # Снята с живого экрана (прогон 2026-08-10), а не предположена: временный локатор
                # «браузер ушёл с формы IdP» засчитывал бы вход и на странице ошибки приложения,
                # чего этот не делает — на Whitelabel Error Page кнопки выхода нет.
                signed-in-locator: text=Выйти
