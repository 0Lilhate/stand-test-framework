# In-JVM parallel execution for the example module (plan §15; the reference realisation of the SDK's
# parallel-safety model). This file MUST live at the test-resources root (src/test/resources) so Gradle's
# processTestResources copies it onto the test classpath root where JUnit Platform reads it — an earlier
# copy under src/test/java was never applied.
#
# Model (the agreed default): test CLASSES run concurrently, METHODS within a class stay on one thread.
# This matches the SDK invariant "one scenario run = one thread": scenarios/classes parallelise, the steps
# of a single scenario never do. Safe here because scenario data is isolated by testRunId, the shared HTTP
# double is bound once at engine-root scope, and the only fixed-port doubles (the gRPC target) are mutually
# excluded with @ResourceLock. This is thread-level parallelism in ONE fork — do NOT combine with Gradle
# maxParallelForks>1, which would spawn multiple JVMs racing the fixed loopback ports.
#
# The example uses a FIXED parallelism (not dynamic.factor) on purpose: dynamic scales to the CPU count, so
# on a 1-2 vCPU CI agent it would collapse to a pool of 1 and the class-level parallel path (and the gRPC
# @ResourceLock exclusion) would never actually run. A fixed pool exercises the parallel path — the exact
# behaviour this reference module must prove — regardless of the runner's core count. Consumers pick their
# own strategy (the root README recommends dynamic for real stands).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=10
