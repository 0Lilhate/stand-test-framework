# Stand environment whitelist for the @StandTest examples, loaded by stand-test-config's
# FileEnvironmentRegistry (ServiceLoader SPI) — the exact file a real consumer puts in
# src/test/resources. It shows the FULL configuration surface: services, datasources, topics,
# grpc-targets and the kafka-cluster of one logical environment.
#
# Every *-ref names an environment variable (a bare NAME or the familiar ${NAME}/${NAME:default}
# placeholder) — a bare URL/secret value is rejected fail-closed. An inline default is a conscious
# trade-off: it lives in the repository, so prefer it for non-secret DEV endpoints only. The example
# build pins the variables to the in-process doubles' fixed addresses (see build.gradle.kts:
# CLIENT_SERVICE_URL, MAIN_DB_URL/USER/PASSWORD, GRPC_TARGET, KAFKA_BOOTSTRAP_SERVERS).
environments:
  ift:
    services:
      client-service:
        base-url-ref: CLIENT_SERVICE_URL
        correlation:
          source: HEADER
          name: X-Correlation-Id
    datasources:
      mainDb:
        url-ref: MAIN_DB_URL
        user-ref: MAIN_DB_USER
        password-ref: MAIN_DB_PASSWORD
        allowed-schemas:
          - test_data
        write-allowed: true
    topics:
      events:
        name: stand-test-example-events
        correlation:
          source: HEADER
          name: X-Correlation-Id
    grpc-targets:
      health-grpc:
        target-ref: GRPC_TARGET
        correlation:
          source: METADATA
          name: x-correlation-id
    kafka-cluster:
      # Placeholder spelling with an inline default: the env var wins when set (the build sets it),
      # otherwise the local-broker default applies.
      bootstrap-servers-ref: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
