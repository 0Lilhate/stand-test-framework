# In-JVM parallel execution for the UI module (ADR-UI-002; BR-25). This file MUST live at the
# test-resources root (src/test/resources) so Gradle's processTestResources copies it onto the test
# classpath root where JUnit Platform reads it — a copy under src/test/java is silently never applied,
# a defect this repository has already been bitten by once.
#
# Model — the same one stand-test-example uses, and the one the module README recommends to consumers:
# test CLASSES run concurrently, METHODS within a class stay on one thread. It follows directly from the
# SDK invariant "one scenario run = one thread": scenarios parallelise, the steps of a single scenario
# never do. The UI adapter is built for it — the browsing session and the account lease live in the run's
# ResourceScope rather than in the executor, and the executor is a stateless singleton the ServiceLoader
# may hand to every run at once.
#
# What makes the module's own suite safe under this: nothing shared is mutable. Each test owns its
# @TempDir artefacts directory, its driver factory and its account-pool registry (UiAccountPools is
# instantiable precisely so a test need not reach for the JVM-wide one), and the two tests that do touch
# process-wide state declare it — @Isolated for the browser-process leak test, @ResourceLock for the one
# that captures the module's logger.
#
# Thread-level parallelism in ONE fork. Do NOT combine with Gradle maxParallelForks > 1: a second JVM
# would get its own account pool, and two JVMs would then hand the same test account to two runs — the
# one guarantee the pool exists to make.
#
# Parallelism is FIXED rather than dynamic.factor, for the reason stand-test-example records: dynamic
# scales to the CPU count, so on a 1-2 vCPU CI agent it collapses to a pool of 1 and the parallel path —
# the exact behaviour these tests must prove — never actually runs. The browserTest task overrides the
# number downwards (see build.gradle.kts): a Chromium per thread is a different kind of budget.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=6
